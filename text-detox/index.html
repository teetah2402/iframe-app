<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEXT DETOX // FLOWORK</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: 'var(--brand-color)', core: 'var(--bg-core)', panel: 'var(--bg-panel)',
              main: 'var(--text-main)', muted: 'var(--text-muted)', border: 'var(--border-color)',
              pop_pink: '#FF4D6D', pop_blue: '#00B4D8', pop_green: '#06D6A0', pop_yellow: '#FFD166',
            },
            fontFamily: { sans: ['"Quicksand"', 'sans-serif'], display: ['"Fredoka"', 'sans-serif'] },
          }
        }
      }
    </script>

    <style>
        /* GUMMY BOARD THEME ENGINE */
        :root {
            --bg-core: #F0F4FF; --bg-panel: #FFFFFF; --text-main: #1E1B4B;
            --text-muted: #4338CA; --border-color: #CBD5E1; --brand-color: #06D6A0; /* Green Gummy */
            --soft-shadow: 0 20px 25px -5px rgba(30, 27, 75, 0.1);
        }
        [data-theme='dark'] {
            --bg-core: #0F172A; --bg-panel: #1E293B; --text-main: #FFFFFF !important;
            --text-muted: #94A3B8 !important; --border-color: #334155; --brand-color: #00FF9D; /* Neon Green (Lama) disesuaikan */
            --soft-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        html, body {
           background-color: var(--bg-core); color: var(--text-main);
           width: 100%; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
           transition: background-color 0.4s ease;
        }

        /* GUMMY RUMUS VISUAL */
        .gummy-board {
            background: var(--bg-panel); border-radius: 2.5rem;
            border: 4px solid var(--border-color); box-shadow: var(--soft-shadow);
        }
        textarea, input, .carved-box {
            color: var(--text-main) !important; background: rgba(0,0,0,0.03) !important;
            border: 2px solid var(--border-color) !important; border-radius: 1.5rem !important;
            outline: none !important; font-weight: 700 !important;
        }
        .btn-game {
            border-bottom: 6px solid rgba(0,0,0,0.2); border-radius: 1.5rem;
            font-weight: 800; transition: all 0.1s ease;
        }
        .btn-game:active:not(:disabled) {
            border-bottom-width: 0px; transform: translateY(6px);
        }

        /* ANIMATIONS */
        .tab-fade-enter-active { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tab-fade-enter-from { opacity: 0; transform: scale(0.9) translateY(20px); }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

        /* UNUSED OLD STYLES
        .font-hud { ... }
        */
    </style>
</head>
<body>

    <main class="flex-1 relative w-full h-full" id="vue-root"></main>

    <script>
        // KAMUS I18N
        const i18n = {
            id: {
                app_title: "TEXT DETOX",
                app_subtitle: "ANTI-AI TRACKING",
                btn_info: "INFO",
                btn_app: "CLEANER",
                status_ready: "READY TO CLEAN",
                stat_removed: "DIHAPUS",
                stat_kept: "TERSISA",
                chars: "karakter",
                label_input: "INPUT (PASTE DI SINI)",
                label_output: "OUTPUT (BERSIH)",
                ph_input: "Paste teks hasil copas AI di sini...\nBiar kuman-kuman 'Invisible Fingerprint'-nya kita sikat habis.",
                ph_output: "Hasil teks suci tanpa noda akan muncul di sini otomatis...",
                btn_paste: "PASTE",
                btn_copy: "SALIN HASIL",
                btn_clear: "HAPUS",

                lander_badge: "ANTI-AI TRACKING",
                lander_title: "TEKS LO KELIHATAN BERSIH?",
                lander_title_hl: "YAKIN?",
                lander_desc_1: "Real talk, Bro. Kita semua tau lo sering copas tugas atau caption dari AI kan? Jujur aja.",
                lander_desc_2: "Platform AI itu licik. Mereka nyisipin 'Invisible Fingerprint'—karakter gaib buat nandain kalo itu tulisan robot. Privasi lo bisa bocor cuma gara-gara teks.",
                lander_btn_start: "DETOX SEKARANG",
                lander_art_badge: "STATUS: STANDBY",
                lander_feat1_title: "Hapus Karakter Gaib",
                lander_feat1_desc: "Zero-width space, soft hyphens, dan sampah unicode lainnya dibabat habis tanpa sisa.",
                lander_feat2_title: "100% Murni Teks",
                lander_feat2_desc: "Output cuma huruf dan simbol standar. Aman di-paste di mana aja tanpa ngerusak format atau kodingan."
            },
            en: {
                app_title: "TEXT DETOX",
                app_subtitle: "ANTI-AI TRACKING",
                btn_info: "INFO",
                btn_app: "CLEANER",
                status_ready: "READY TO CLEAN",
                stat_removed: "REMOVED",
                stat_kept: "KEPT",
                chars: "chars",
                label_input: "INPUT (PASTE HERE)",
                label_output: "OUTPUT (CLEAN)",
                ph_input: "Paste your AI-generated text here...\nLet's wipe out those invisible fingerprints.",
                ph_output: "Your pure, spotless text will appear here automatically...",
                btn_paste: "PASTE",
                btn_copy: "COPY RESULT",
                btn_clear: "CLEAR",

                lander_badge: "ANTI-AI TRACKING",
                lander_title: "YOUR TEXT LOOKS CLEAN?",
                lander_title_hl: "ARE YOU SURE?",
                lander_desc_1: "Real talk, Bro. We all know you copy-paste from AI. Be honest.",
                lander_desc_2: "AI platforms are sneaky. They insert 'Invisible Fingerprints'—ghost characters to mark it as bot-written. Your privacy leaks through text.",
                lander_btn_start: "DETOX NOW",
                lander_art_badge: "STATUS: STANDBY",
                lander_feat1_title: "Erase Ghost Characters",
                lander_feat1_desc: "Zero-width spaces, soft hyphens, and unicode junk are completely wiped out.",
                lander_feat2_title: "100% Pure Text",
                lander_feat2_desc: "Output is just standard letters and symbols. Safe to paste anywhere without breaking formatting."
            }
        };

        const AppCore = {
            vueInstance: null,

            async init() {
                const savedTheme = localStorage.getItem('flowork_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', savedTheme);

                const cb = Date.now();
                const [rLander, rApp] = await Promise.all([fetch('partials/lander.html?v='+cb), fetch('partials/app.html?v='+cb)]);

                document.getElementById('vue-root').innerHTML = `
                   <v-app style="background: transparent;">
                       <v-main class="h-full flex flex-col relative overflow-hidden">
                           <transition name="tab-fade"><div v-show="currentTab === 'lander'" class="w-full h-full overflow-y-auto absolute top-0 left-0">${await rLander.text()}</div></transition>
                           <transition name="tab-fade"><div v-show="currentTab === 'app'" class="w-full h-full overflow-y-auto md:overflow-hidden pb-40 md:pb-0 flex flex-col absolute top-0 left-0">${await rApp.text()}</div></transition>
                       </v-main>
                   </v-app>`;

                this.initVue(savedTheme);

                window.addEventListener('message', (e) => {
                    if (e.data?.type === 'THEME_CHANGE') {
                        document.documentElement.setAttribute('data-theme', e.data.theme);
                        localStorage.setItem('flowork_theme', e.data.theme);
                        if(this.vueInstance) this.vueInstance.theme.global.name.value = e.data.theme;
                    }
                    if (e.data?.type === 'LANG_CHANGE' && this.vueInstance) {
                        localStorage.setItem('flowork_lang', e.data.lang);
                        this.vueInstance.currentLang.value = e.data.lang;
                    }
                });

                console.log("SYSTEM: TEXT DETOX READY (GUMMY V5.0)");
            },

            initVue(savedTheme) {
                const { createApp, ref, computed } = Vue;
                const { createVuetify, useTheme } = Vuetify;

                const app = createApp({
                    setup() {
                        const theme = useTheme();
                        const currentTab = ref('app'); // WAJIB DEFAULT 'app'

                        const currentLang = ref(localStorage.getItem('flowork_lang') || 'en');
                        const t = computed(() => i18n[currentLang.value] || i18n['en']);

                        // STATE LAMA DETOX ENGINE (Di-rebuild ke Vue Reactivity)
                        const inputText = ref('');

                        // LOGIC CLEANER (Menghapus Zero-Width & Karakter Gaib)
                        const outputText = computed(() => {
                            if (!inputText.value) return '';
                            // Regex sakti buat hapus invisible chars (ZWSP, ZWNJ, ZWJ, LRM, RLM, dll)
                            return inputText.value.replace(/[\u200B-\u200D\uFEFF\u200E\u200F\u202A-\u202E\u2060-\u206F]/g, '');
                        });

                        const countRemoved = computed(() => {
                            if (!inputText.value) return 0;
                            return inputText.value.length - outputText.value.length;
                        });

                        const countKept = computed(() => {
                            return outputText.value.length;
                        });

                        const pasteInput = async () => {
                            try {
                                const text = await navigator.clipboard.readText();
                                inputText.value = text;
                            } catch (err) {
                                console.error('Failed to read clipboard contents: ', err);
                            }
                        };

                        const copyOutput = () => {
                            if (outputText.value) {
                                navigator.clipboard.writeText(outputText.value);
                            }
                        };

                        const clearAll = () => {
                            inputText.value = '';
                        };

                        AppCore.vueInstance = { theme, currentLang };
                        return {
                            currentTab, t,
                            inputText, outputText, countRemoved, countKept,
                            pasteInput, copyOutput, clearAll
                        };
                    }
                });

                app.use(createVuetify({ theme: { defaultTheme: savedTheme } })).mount('#vue-root');
            }
        };

        window.switchAppTab = (tabName) => {
            if(AppCore.vueInstance && AppCore.vueInstance._instance) {
                 AppCore.vueInstance._instance.setupState.currentTab = tabName;
            } else {
                 document.getElementById('vue-root').__vue_app__._instance.setupState.currentTab = tabName;
            }
        };

        window.appCore = AppCore;
        window.onload = () => AppCore.init();
    </script>
</body>
</html>
