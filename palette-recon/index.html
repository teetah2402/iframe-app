<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palette Recon | Thumbnail Visual Intel</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      // Persistence Logic: Get Theme Before Render
      const getSavedTheme = () => {
        try { return localStorage.getItem('flowork_os_theme') || 'dark'; }
        catch(e) { return 'dark'; }
      };
      document.documentElement.setAttribute('data-theme', getSavedTheme());

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: 'var(--brand-color)', core: 'var(--bg-core)', panel: 'var(--bg-panel)',
              main: 'var(--text-main)', muted: 'var(--text-muted)', border: 'var(--border-color)',
              pop_pink: '#FF4D6D', pop_blue: '#00B4D8', pop_green: '#06D6A0', pop_yellow: '#FFD166',
            },
            fontFamily: { sans: ['"Quicksand"', 'sans-serif'], display: ['"Fredoka"', 'sans-serif'] },
          }
        }
      }
    </script>

    <style>
        :root {
            --bg-core: #F0F4FF; --bg-panel: #FFFFFF; --text-main: #1E1B4B;
            --text-muted: #4338CA; --border-color: #CBD5E1; --brand-color: #F59E0B;
            --soft-shadow: 0 20px 25px -5px rgba(30, 27, 75, 0.1);
        }
        [data-theme='dark'] {
            --bg-core: #0F172A; --bg-panel: #1E293B; --text-main: #FFFFFF !important;
            --text-muted: #94A3B8 !important; --border-color: #334155; --brand-color: #FBBF24;
            --soft-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* HIDE SCROLLBAR GLOBAL */
        * { -ms-overflow-style: none; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }

        html, body {
            background-color: var(--bg-core); color: var(--text-main);
            width: 100%; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            transition: background-color 0.4s ease;
        }

        .gummy-board {
            background: var(--bg-panel); border-radius: 2.5rem;
            border: 4px solid var(--border-color); box-shadow: var(--soft-shadow);
        }

        /* Input look "Diukir" */
        input[type="file"] { display: none; }

        .btn-game {
            border-bottom: 6px solid rgba(0,0,0,0.2); border-radius: 1.5rem;
            font-weight: 800; transition: all 0.1s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-game:active { border-bottom-width: 0px; transform: translateY(6px); }

        .tab-fade-enter-active { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tab-fade-enter-from { opacity: 0; transform: scale(0.9) translateY(20px); }

        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="no-scrollbar">
    <main class="flex-1 relative w-full h-full" id="vue-root"></main>

    <script>
        const i18n = {
            id: {
                title: "PALETTE RECON",
                status_waiting_input: "SIAP SCAN...",
                status_processing: "MEMBEDAH PIXEL...",
                status_done: "SCAN SELESAI!",
                brief_btn: "TUTORIAL", intel_btn: "DASHBOARD",
                lander_badge: "DEEP SCAN: TOP 30 DOMINANT",
                lander_title: "BONGKAR RESEP <br> <span class='text-brand'>WARNA VIRAL.</span>",
                lander_desc: "Lu pernah lihat YouTuber dengan views jutaan? Faktor pertamanya ada di <b>Thumbnail</b>. Dengan alat ini, lu bisa analisa 30 warna kunci yang mereka pakai.",
                lander_btn: "MULAI SCAN SEKARANG",
                feat_psych_title: "Psychology Intel",
                feat_psych_desc: "Tahu efek psikologis setiap warna ke audiens lo.",
                feat_zone_title: "Top 30 Zones",
                feat_zone_desc: "Ekstraksi hingga 30 zona warna paling dominan.",
                app_upload_title: "UPLOAD GAMBAR",
                app_upload_desc: "TAP UNTUK SCAN PIXEL",
                app_result_title: "Dominant Palette",
                app_empty_title: "BELUM ADA INTEL",
                app_empty_desc: "Upload thumbnail untuk memulai pencurian data visual.",
                copy_msg: "Tersalin ke clipboard!",
                back: "KEMBALI"
            },
            en: {
                title: "PALETTE RECON",
                status_waiting_input: "READY TO SCAN...",
                status_processing: "EXTRACTING PIXELS...",
                status_done: "SCAN COMPLETE!",
                brief_btn: "BRIEF", intel_btn: "INTEL",
                lander_badge: "DEEP SCAN: TOP 30 DOMINANT",
                lander_title: "DECODE <br> <span class='text-brand'>VIRAL COLORS.</span>",
                lander_desc: "Ever seen a YouTuber with millions of views? The first factor is the <b>Thumbnail</b>. With this tool, you can analyze the 30 key colors they use.",
                lander_btn: "START SCAN NOW",
                feat_psych_title: "Psychology Intel",
                feat_psych_desc: "Know the psychological effect of every color on your audience.",
                feat_zone_title: "Top 30 Zones",
                feat_zone_desc: "Extract up to 30 most dominant color zones.",
                app_upload_title: "UPLOAD IMAGE",
                app_upload_desc: "TAP HERE TO SCAN PIXELS",
                app_result_title: "Dominant Palette",
                app_empty_title: "NO INTEL YET",
                app_empty_desc: "Upload a thumbnail to start visual data extraction.",
                copy_msg: "Copied to clipboard!",
                back: "BACK"
            }
        };

        const AppCore = {
            vueInstance: null,
            async init() {
                const cb = Date.now();
                const [rLander, rApp] = await Promise.all([
                    fetch('partials/lander.html?v='+cb),
                    fetch('partials/app.html?v='+cb)
                ]);

                document.getElementById('vue-root').innerHTML = `
                    <v-app style="background: transparent;">
                        <v-main class="h-full flex flex-col relative overflow-hidden">
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'lander'" class="w-full h-full overflow-y-auto no-scrollbar absolute top-0 left-0 bg-transparent">
                                    ${await rLander.text()}
                                </div>
                            </transition>
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'app'" class="w-full h-full overflow-y-auto md:overflow-hidden flex flex-col absolute top-0 left-0 bg-transparent">
                                    ${await rApp.text()}
                                </div>
                            </transition>
                        </v-main>
                    </v-app>`;

                this.initVue();

                window.addEventListener('message', (e) => {
                    if (e.data?.type === 'THEME_CHANGE') {
                        document.documentElement.setAttribute('data-theme', e.data.theme);
                        localStorage.setItem('flowork_os_theme', e.data.theme);
                        if(this.vueInstance) this.vueInstance.theme.global.name.value = e.data.theme;
                    }
                    if (e.data?.type === 'LANG_CHANGE' && this.vueInstance) {
                        localStorage.setItem('flowork_lang', e.data.lang);
                        this.vueInstance.currentLang.value = e.data.lang;
                    }
                });
            },

            initVue() {
                const { createApp, ref, computed } = Vue;
                const { createVuetify, useTheme } = Vuetify;

                const app = createApp({
                    setup() {
                        const theme = useTheme();
                        const currentTab = ref('app');
                        const currentLang = ref(localStorage.getItem('flowork_lang') || 'en');
                        const t = computed(() => i18n[currentLang.value] || i18n['en']);

                        const previewImg = ref(null);
                        const palette = ref([]);
                        const scanStatus = ref('waiting_input');
                        const selectedColor = ref(null);

                        const handleFile = (e) => {
                            const file = e.target.files[0];
                            if(!file) return;
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                previewImg.value = ev.target.result;
                                analyzeImage(ev.target.result);
                            };
                            reader.readAsDataURL(file);
                        };

                        const analyzeImage = (src) => {
                            scanStatus.value = 'processing';
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const ctx = canvas.getContext('2d');
                                const maxDim = 300;
                                let w = img.width, h = img.height;
                                if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
                                else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
                                canvas.width = w; canvas.height = h;
                                ctx.drawImage(img, 0, 0, w, h);
                                const imageData = ctx.getImageData(0, 0, w, h).data;
                                const colorMap = {};
                                for (let i = 0; i < imageData.length; i += 4 * 10) {
                                    const r = imageData[i], g = imageData[i+1], b = imageData[i+2], a = imageData[i+3];
                                    if (a < 128) continue;
                                    const rQ = Math.round(r/10)*10, gQ = Math.round(g/10)*10, bQ = Math.round(b/10)*10;
                                    const key = `${rQ},${gQ},${bQ}`;
                                    colorMap[key] = (colorMap[key] || 0) + 1;
                                }
                                palette.value = Object.keys(colorMap)
                                    .map(key => {
                                        const [r, g, b] = key.split(',').map(Number);
                                        return { r, g, b, count: colorMap[key], hex: "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase() };
                                    })
                                    .sort((a, b) => b.count - a.count).slice(0, 30);
                                scanStatus.value = 'done';
                                if(palette.value.length > 0) selectedColor.value = palette.value[0];
                            };
                            img.src = src;
                        };

                        const getColorPsychology = (color) => {
                            const {r, g, b} = color;
                            if (r > 220 && g > 220 && b > 220) return "WHITESPACE: Bersih, Elegan, & Modern.";
                            if (r < 40 && g < 40 && b < 40) return "VOID: Dominasi Kuat, Kontras Tinggi & Misterius.";
                            if (r > g + 50 && r > b + 50) return "URGENCY: Memicu CTR tinggi, Agresif & Berani (Red).";
                            if (g > r + 30 && g > b + 30) return "GROWTH: Segar, Aman, & Solutif (Green).";
                            if (b > r + 30 && b > g + 30) return "TRUST: Profesional, Stabil, & Tech Vibe (Blue).";
                            return "BALANCE: Penyeimbang komposisi visual yang harmonis.";
                        };

                        const copyHex = (hex) => {
                            navigator.clipboard.writeText(hex);
                            // Simple gumy alert placeholder
                            alert(t.value.copy_msg + ": " + hex);
                        };

                        AppCore.vueInstance = { theme, currentLang };
                        return { currentTab, t, handleFile, previewImg, palette, scanStatus, selectedColor, getColorPsychology, copyHex };
                    }
                });

                app.use(createVuetify({ theme: { defaultTheme: getSavedTheme() } })).mount('#vue-root');
            }
        };

        window.onload = () => AppCore.init();
    </script>
</body>
</html>
