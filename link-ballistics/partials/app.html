<div class="w-full px-6 py-4 flex justify-between items-center bg-panel/50 backdrop-blur-md border-b-4 border-border shrink-0 z-50">
    <div class="flex items-center gap-4">
        <div class="bg-brand p-2 rounded-xl shadow-lg -rotate-6">
            <v-icon icon="mdi-target" color="white"></v-icon>
        </div>
        <div class="flex flex-col">
            <span class="font-display font-black text-2xl tracking-tighter leading-none text-main uppercase">LINK<span class="text-brand">BALLISTICS</span></span>
            <span class="text-[8px] font-black opacity-40 uppercase tracking-[0.2em] mt-1 text-main">WhatsApp Rotator v3.0</span>
        </div>
    </div>
    <button @click="currentTab = 'lander'" class="btn-game bg-panel border-4 border-border px-6 py-2 text-[10px] flex items-center gap-2 hover:text-brand transition-all">
        <v-icon size="16">mdi-information-outline</v-icon> INFO
    </button>
</div>

<div class="flex-1 flex flex-col md:flex-row p-4 md:p-10 gap-10 relative overflow-hidden">

    <div class="w-full md:w-[380px] flex flex-col gap-8 shrink-0 h-auto md:h-full overflow-y-auto no-scrollbar">

        <div class="gummy-board p-8 flex flex-col relative overflow-hidden flex-1 border-brand/20 shadow-inner">
            <div class="flex justify-between items-center mb-8">
                <h3 class="font-display font-black text-main opacity-60 uppercase text-[11px] tracking-widest">{{ t.step1 }}</h3>
                <button @click="numbers.push('')" class="btn-game w-12 h-12 bg-pop_green text-black text-xl flex items-center justify-center border-3 border-black/20 hover:scale-110 transition-all">
                    <v-icon>mdi-plus</v-icon>
                </button>
            </div>

            <div class="space-y-4 overflow-y-auto no-scrollbar pr-1">
                <div v-for="(num, idx) in numbers" :key="idx" class="flex items-center gap-4 animate-pop-in">
                    <div class="w-8 h-8 bg-black/5 rounded-full flex items-center justify-center text-[10px] font-black opacity-30">{{ idx + 1 }}</div>
                    <input v-model="numbers[idx]" type="tel" class="flex-1 text-lg font-black tracking-tight" placeholder="628xxxx">
                    <button @click="numbers.length > 1 && numbers.splice(idx, 1)" class="w-10 h-10 text-pop_pink font-black text-2xl hover:scale-125 transition-transform">
                        <v-icon>mdi-close-circle-outline</v-icon>
                    </button>
                </div>
            </div>

            <div v-if="numbers.length === 0" class="flex-1 flex flex-col items-center justify-center opacity-10">
                <v-icon size="80">mdi-account-off-outline</v-icon>
                <p class="font-black text-xs mt-4">NO ADMINS ADDED</p>
            </div>
        </div>

        <div class="pb-40 md:pb-6">
            <button @click="generateLink" class="btn-game w-full py-8 bg-pop_green text-black text-2xl shadow-[0_12px_0_#04A077] hover:scale-[1.02] active:scale-95 transition-all">
                {{ t.genBtn }}
            </button>
        </div>
    </div>

    <div class="flex-1 flex flex-col gap-10">

        <div class="flex-1 gummy-board p-10 flex flex-col bg-black/5 shadow-inner">
            <div class="flex items-center gap-3 mb-6 opacity-60">
                <v-icon size="18">mdi-comment-text-outline</v-icon>
                <h3 class="font-display font-black text-main uppercase text-[11px] tracking-widest">{{ t.step2 }}</h3>
            </div>
            <textarea
                v-model="message"
                class="flex-1 w-full text-2xl font-black bg-transparent border-none resize-none no-scrollbar leading-relaxed placeholder:opacity-20"
                placeholder="Halo Kak, mau tanya harga..."
            ></textarea>
        </div>

        <div class="h-64 gummy-board p-10 relative overflow-hidden flex flex-col justify-center border-brand/40 bg-brand/5">
            <div v-if="finalUrl" class="animate-pop-in">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-display font-black text-brand uppercase text-[11px] tracking-widest">{{ t.step3 }}</h3>
                    <span class="px-6 py-2 bg-pop_green text-black font-black rounded-full text-[10px] uppercase tracking-tighter border-2 border-black/10 animate-bounce">Ready to Launch! 🎯</span>
                </div>

                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex-1 gummy-board bg-white/60 p-5 overflow-hidden">
                        <input readonly :value="finalUrl" class="w-full bg-transparent border-none text-sm font-mono font-black text-brand truncate">
                    </div>
                    <button @click="copyLink" class="btn-game px-12 py-5 bg-brand text-white text-xl shadow-[0_8px_0_rgba(0,0,0,0.2)]">
                        {{ t.copyBtn }}
                    </button>
                </div>
            </div>

            <div v-else class="flex flex-col items-center justify-center opacity-10 py-10">
                <v-icon icon="mdi-crosshairs-question" size="100" class="animate-pulse"></v-icon>
                <p class="font-display text-4xl font-black tracking-tight uppercase mt-6">Awaiting Targets</p>
            </div>
        </div>
    </div>
</div>
