<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mark Command | Bikin Readme Sambil Main!</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: 'var(--brand-color)',
              /* OLD: brand_shadow: 'var(--brand-shadow)', */
              core: 'var(--bg-core)',
              panel: 'var(--bg-panel)',
              main: 'var(--text-main)',
              muted: 'var(--text-muted)',
              border: 'var(--border-color)',
              /* OLD COLORS
              pop_yellow: '#FFD166',
              pop_pink: '#EF476F',
              pop_blue: '#118AB2',
              pop_green: '#06D6A0',
              */
              /* NEW GUMMY COLORS */
              pop_pink: '#FF4D6D',
              pop_blue: '#00B4D8',
              pop_green: '#06D6A0',
              pop_yellow: '#FFD166',
            },
            fontFamily: {
              sans: ['"Quicksand"', 'sans-serif'],
              display: ['"Fredoka"', 'sans-serif'],
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'wiggle': 'wiggle 1s ease-in-out infinite',
              'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            },
            keyframes: {
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              },
              popIn: {
                '0%': { opacity: 0, transform: 'scale(0.5)' },
                '100%': { opacity: 1, transform: 'scale(1)' },
              }
            }
          }
        }
      }
    </script>

    <style>
        /* OLD CSS VARIABLES
        :root {
            --bg-core: #F8F9FA; --bg-panel: #FFFFFF; --text-main: #2B2D42;
            --text-muted: #8D99AE; --border-color: #EDF2F4; --brand-color: #3A86FF;
            --brand-shadow: #216CE6;
        }
        [data-theme='dark'], [data-theme='cyberpunk'], [data-theme='hacker'] {
            --bg-core: #171026; --bg-panel: #261A3D; --text-main: #FFFFFF;
            --text-muted: #A393BF; --border-color: #3E2F5E; --brand-color: #FF006E;
            --brand-shadow: #CC0058;
        }
        */

        /* NEW GUMMY CSS VARIABLES */
        :root {
            --bg-core: #F0F4FF; --bg-panel: #FFFFFF; --text-main: #1E1B4B;
            --text-muted: #4338CA; --border-color: #CBD5E1; --brand-color: #F72585;
            --soft-shadow: 0 20px 25px -5px rgba(30, 27, 75, 0.1);
        }
        [data-theme='dark'], [data-theme='cyberpunk'], [data-theme='hacker'] {
            --bg-core: #0F172A; --bg-panel: #1E293B; --text-main: #FFFFFF !important;
            --text-muted: #94A3B8 !important; --border-color: #334155; --brand-color: #FF006E;
            --soft-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* OLD BODY RULES
        html, body {
            background-color: var(--bg-core); color: var(--text-main); font-family: 'Quicksand', sans-serif;
            overflow: hidden; width: 100%; height: 100dvh; margin: 0; padding: 0;
            display: flex; flex-direction: column; transition: background-color 0.4s ease, color 0.4s ease;
        }
        */

        /* NEW GUMMY BODY RULES */
        html, body {
            background-color: var(--bg-core); color: var(--text-main);
            width: 100%; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            transition: background-color 0.4s ease;
        }

        /* NEW GUMMY BOARD CARD COMPONENT */
        .gummy-board {
            background: var(--bg-panel); border-radius: 2.5rem;
            border: 4px solid var(--border-color); box-shadow: var(--soft-shadow);
        }

        /* NEW GUMMY INPUT/TEXTAREA RULES */
        textarea, input {
            color: var(--text-main) !important; background: rgba(0,0,0,0.03) !important;
            border: 2px solid var(--border-color) !important; border-radius: 1.5rem !important;
            outline: none !important; font-weight: 700 !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; overscroll-behavior-y: none; }

        .safe-layout {
            flex: 1; width: 100%; height: 100%; overflow: hidden;
            display: flex; flex-direction: column; position: relative;
        }

        /* OLD BTN GAME
        .btn-game { border-bottom-width: 6px; transition: all 0.1s ease; }
        .btn-game:active { border-bottom-width: 0px; transform: translateY(6px); }
        */

        /* NEW GUMMY BTN GAME */
        .btn-game {
            border-bottom: 6px solid rgba(0,0,0,0.2); border-radius: 1.5rem;
            font-weight: 800; transition: all 0.1s ease;
        }
        .btn-game:active {
            border-bottom-width: 0px; transform: translateY(6px);
        }

        .tab-fade-enter-active {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tab-fade-enter-from { opacity: 0; transform: scale(0.9) translateY(20px); }

        /* OLD TEXTAREA FOCUS (Gummy uses explicit carved styling, but keeping this as extra spice if needed) */
        .textarea-fun:focus {
            outline: 4px dashed var(--brand-color) !important;
            outline-offset: 4px;
            background-color: rgba(var(--bg-panel), 0.5) !important;
        }
    </style>
</head>
<body class="no-scrollbar">

    <main class="safe-layout no-scrollbar flex-1 relative w-full h-full" id="vue-root"></main>

    <script>
        function getOSLang() {
            try { return window.parent.localStorage.getItem('flowork_lang') || localStorage.getItem('flowork_lang') || 'en'; }
            catch(e) { return localStorage.getItem('flowork_lang') || 'en'; }
        }
        function getOSTheme() {
            try { return window.parent.localStorage.getItem('flowork_os_theme') || localStorage.getItem('flowork_os_theme') || 'dark'; }
            catch(e) { return localStorage.getItem('flowork_os_theme') || 'dark'; }
        }

        document.documentElement.setAttribute('data-theme', getOSTheme());

        // KAMUS DILEWATI (TETAP SAMA SEPERTI ASLI)
        const i18n = {
            id: {
                title1: "Bikin Dokumen", title2: "Sambil Main!", subtitle: "README ARCHITECT V3.5 🎮", badge: "🌟 Seru & Nggak Kaku!", btnLaunch: "Mulai Main! 🚀", desc: "Ucapkan selamat tinggal pada editor yang membosankan. Saatnya ngetik dengan gaya!", proTitle: "Level Maksimal Terbuka! 🏆", proBadge: "VIP PLAYER", proGreeting: "Wuih, halo Player 1! Semua skin premium dan fitur rahasia udah kebuka buat kamu.", btnConfig: "Atur Joystick (Settings)", docTitle: "Ngetik Koding Nggak Harus Pusing 🧩", docP1: "Siapa bilang bikin dokumentasi itu bikin ngantuk? Mark Command dibikin khusus biar lo ngerasa lagi main game sambil nyelesaiin kerjaan.", docH3: "Skill Keren Mark Command:", docF1: "✨ <strong class='text-main'>Super Responsif:</strong> Main di PC atau HP sama-sama mulus.", docF2: "✨ <strong class='text-main'>Warna-Warni:</strong> Tulisan lo nggak bakal item putih doang.", docF3: "✨ <strong class='text-main'>Save Instan:</strong> Tinggal klik, langsung kelar misinya!", eof: "Game Over? Enggak dong, ini baru mulai! 🎉", appBasic: "Misi Basic", appApi: "Misi API", appSave: "Save Game (Unduh)", appBack: "Peta Utama", appInput: "Kotak Ketik ✍️", appPreview: "Hasilnya Nih 👀", placeholder: "Ketik kode rahasia atau ceritamu di sini..."
            },
            en: {
                title1: "Write Docs", title2: "Like Playing!", subtitle: "README ARCHITECT V3.5 🎮", badge: "🌟 Fun & Bouncy!", btnLaunch: "Start Playing! 🚀", desc: "Say goodbye to boring editors. It's time to type with style!", proTitle: "Max Level Unlocked! 🏆", proBadge: "VIP PLAYER", proGreeting: "Whoa, hello Player 1! All premium skins and secret features are unlocked for you.", btnConfig: "Joystick Setup (Settings)", docTitle: "Coding Docs Shouldn't Be Boring 🧩", docP1: "Who says writing documentation puts you to sleep? Mark Command is built so you feel like playing a game while getting work done.", docH3: "Mark Command's Super Skills:", docF1: "✨ <strong class='text-main'>Super Responsive:</strong> Smooth on PC or Mobile.", docF2: "✨ <strong class='text-main'>Colorful Text:</strong> Your words won't just be black and white.", docF3: "✨ <strong class='text-main'>Instant Save:</strong> Click once, mission accomplished!", eof: "Game Over? Nah, we're just getting started! 🎉", appBasic: "Basic Quest", appApi: "API Quest", appSave: "Save Game (Download)", appBack: "Main Map", appInput: "Type Here ✍️", appPreview: "Magic Output 👀", placeholder: "Type your secret codes or stories here..."
            }
        };

        const AppCore = {
            vueInstance: null,

            async init() {
                const cb = Date.now();
                const [rLander, rApp] = await Promise.all([fetch('partials/lander.html?v='+cb), fetch('partials/app.html?v='+cb)]);
                const landerHtml = await rLander.text();
                const appHtml = await rApp.text();

                /* OLD RENDER LOGIC
                document.getElementById('vue-root').innerHTML = `
                    <v-app style="background: transparent; min-height: 0; height: 100%;" class="no-scrollbar">
                        ...
                    </v-app>
                `;
                */

                // NEW GUMMY BOILERPLATE RENDER LOGIC
                document.getElementById('vue-root').innerHTML = `
                    <v-app style="background: transparent;">
                        <v-main class="h-full flex flex-col relative overflow-hidden">
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'lander'" class="w-full h-full overflow-y-auto absolute top-0 left-0">
                                    ${landerHtml}
                                </div>
                            </transition>
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'app'" class="w-full h-full overflow-y-auto md:overflow-hidden pb-40 md:pb-0 flex flex-col absolute top-0 left-0">
                                    ${appHtml}
                                </div>
                            </transition>
                        </v-main>
                    </v-app>`;

                this.initVue();

                window.addEventListener('message', (e) => {
                    if (e.data?.type === 'FLOWORK_IDENTITY_SYNC') {
                        if(this.vueInstance) this.vueInstance.userIdentity = e.data.userAddress;
                    }
                    if (e.data?.type === 'THEME_CHANGE') {
                        document.documentElement.setAttribute('data-theme', e.data.theme);
                        if (this.vueInstance) this.vueInstance.vuetifyTheme.global.name.value = e.data.theme;
                    }
                    // NEW: LANG CHANGE LISTENER
                    if (e.data?.type === 'LANG_CHANGE' && this.vueInstance) {
                        this.vueInstance.currentLang.value = e.data.lang;
                    }
                });
            },

            initVue() {
                const { createApp, ref, computed } = Vue;
                const { createVuetify, useTheme } = Vuetify;

                const app = createApp({
                    setup() {
                        const theme = useTheme();
                        const userIdentity = ref(null);
                        const currentTab = ref('app'); // Default ke App sesuai rule Workspace
                        const currentLang = ref(getOSLang());
                        const t = computed(() => i18n[currentLang.value] || i18n['en']);

                        const defaultText = computed(() => currentLang.value === 'en'
                            ? "# 🎉 Yay! You Made It!\n\nWelcome to your fun workspace! Let's build something awesome.\n\n## Cool Stuff to Do\n- [x] Write code\n- [ ] Have fun\n\n```javascript\nconsole.log('Level Up! 🍄');\n```"
                            : "# 🎉 Hore! Masuk Juga!\n\nSelamat datang di arena main kamu! Yuk bikin yang keren-keren.\n\n## Hal Seru Hari Ini\n- [x] Ngetik kode\n- [ ] Senang-senang\n\n```javascript\nconsole.log('Naik Level! 🍄');\n```"
                        );

                        const input = ref(defaultText.value);
                        const compiledMarkdown = computed(() => marked.parse(input.value));

                        const switchTab = (tab) => currentTab.value = tab;
                        const openSettings = () => window.parent.postMessage({ type: 'OPEN_SETTINGS', tab: 'variables' }, '*');

                        const insertTemplate = (type) => {
                            if (type === 'basic') {
                                input.value = currentLang.value === 'en'
                                ? `# 🌟 Cool Project\n\n> This is where the magic happens.\n\n## 🛠 Tools Used\n- Big Brain Energy\n- Lots of Coffee`
                                : `# 🌟 Proyek Keren\n\n> Di sinilah keajaiban terjadi.\n\n## 🛠 Senjata yang Dipakai\n- Semangat 45\n- Kopi Segelas`;
                            } else if (type === 'api') {
                                input.value = currentLang.value === 'en'
                                ? `# 🔌 API Gateway\n\n\`https://api.game.com/v1\`\n\n\`\`\`json\n{\n  "loot": "Epic Sword",\n  "exp": 1000\n}\n\`\`\``
                                : `# 🔌 Portal API\n\n\`https://api.game.com/v1\`\n\n\`\`\`json\n{\n  "hadiah": "Pedang Sakti",\n  "exp": 1000\n}\n\`\`\``;
                            }
                        };

                        const downloadMD = () => {
                            const blob = new Blob([input.value], { type: 'text/markdown' });
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(blob);
                            a.download = 'README.md';
                            a.click();
                        };

                        AppCore.vueInstance = { userIdentity, vuetifyTheme: theme, currentLang };
                        return { currentTab, t, input, compiledMarkdown, userIdentity, switchTab, openSettings, insertTemplate, downloadMD };
                    }
                });

                app.use(createVuetify({ theme: { defaultTheme: getOSTheme() } })).mount('#vue-root');
            }
        };

        window.onload = () => AppCore.init();
    </script>
</body>
</html>
