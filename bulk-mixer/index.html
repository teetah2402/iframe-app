<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bulk Mixer | Content Fusion Engine</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      const getSavedTheme = () => localStorage.getItem('flowork_os_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', getSavedTheme());

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: 'var(--brand-color)', core: 'var(--bg-core)', panel: 'var(--bg-panel)',
              main: 'var(--text-main)', muted: 'var(--text-muted)', border: 'var(--border-color)',
              pop_pink: '#FF4D6D', pop_blue: '#00B4D8', pop_green: '#06D6A0', pop_yellow: '#FFD166',
            },
            fontFamily: { sans: ['"Quicksand"', 'sans-serif'], display: ['"Fredoka"', 'sans-serif'] },
          }
        }
      }
    </script>

    <style>
        :root {
            --bg-core: #F0F4FF; --bg-panel: #FFFFFF; --text-main: #1E1B4B;
            --text-muted: #4338CA; --border-color: #CBD5E1; --brand-color: #F72585;
            --soft-shadow: 0 20px 25px -5px rgba(30, 27, 75, 0.1);
        }
        [data-theme='dark'] {
            --bg-core: #0F172A; --bg-panel: #1E293B; --text-main: #FFFFFF !important;
            --text-muted: #94A3B8 !important; --border-color: #334155; --brand-color: #FF006E;
            --soft-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * { -ms-overflow-style: none; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }

        html, body {
            background-color: var(--bg-core); color: var(--text-main);
            width: 100%; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            transition: background-color 0.4s ease; margin: 0; padding: 0;
        }

        .gummy-board {
            background: var(--bg-panel); border-radius: 2.5rem;
            border: 4px solid var(--border-color); box-shadow: var(--soft-shadow);
        }

        textarea, input, select {
            color: var(--text-main) !important; background: rgba(0,0,0,0.05) !important;
            border: 3px solid var(--border-color) !important; border-radius: 1.5rem !important;
            outline: none !important; font-weight: 800 !important;
        }

        .btn-game {
            border-bottom: 6px solid rgba(0,0,0,0.25); border-radius: 1.8rem;
            font-weight: 800; transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
        }
        .btn-game:active:not(:disabled) { border-bottom-width: 0px; transform: translateY(6px); }

        .tab-fade-enter-active { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tab-fade-enter-from { opacity: 0; transform: scale(0.95) translateY(30px); }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>
    <main class="flex-1 relative w-full h-full" id="vue-root"></main>

    <script>
        const i18n = {
            id: {
                heroTitle: "Fusi Konten", heroSub: "Secara Masif!",
                heroDesc: "Jangan buang waktu ngedit satu-satu, BAKA! Biarkan algoritma alkimia ini menjahit ratusan video lo otomatis.",
                startBtn: "AKTIFKAN MESIN FUSI!",
                step1: "1. KOLAM BAHAN 📦", step2: "2. PENGATURAN ⚙️", step3: "3. TERMINAL PROSES 📟",
                modeAudio: "🎵 MASTER AUDIO (IKUT DURASI LAGU)",
                modeVideo: "🎬 MASTER VIDEO (IKUT DURASI VIDEO)",
                processBtn: "JAHIT SEKARANG! 🧵",
                back: "KEMBALI"
            },
            en: {
                heroTitle: "Content Fusion", heroSub: "Massive Scale!",
                heroDesc: "Don't waste time editing one by one! Let this alchemy algorithm stitch hundreds of your videos automatically.",
                startBtn: "ACTIVATE FUSION ENGINE!",
                step1: "1. RESOURCE POOL 📦", step2: "2. SETTINGS ⚙️", step3: "3. PROCESS TERMINAL 📟",
                modeAudio: "🎵 AUDIO MASTER (STITCH TO SONG)",
                modeVideo: "🎬 VIDEO MASTER (STITCH TO VIDEO)",
                processBtn: "START STITCHING! 🧵",
                back: "BACK"
            }
        };

        const AppCore = {
            vueInstance: null,
            async init() {
                const cb = Date.now();
                const [rLander, rApp] = await Promise.all([
                    fetch('partials/lander.html?v=' + cb),
                    fetch('partials/app.html?v=' + cb)
                ]);

                document.getElementById('vue-root').innerHTML = `
                    <v-app style="background: transparent;">
                        <v-main class="h-full relative overflow-hidden flex flex-col">
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'lander'" class="w-full h-full overflow-y-auto no-scrollbar absolute top-0 left-0 bg-transparent">
                                    ${await rLander.text()}
                                </div>
                            </transition>
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'app'" class="w-full h-full overflow-y-auto md:overflow-hidden flex flex-col absolute top-0 left-0 bg-transparent">
                                    ${await rApp.text()}
                                </div>
                            </transition>
                        </v-main>
                    </v-app>`;

                this.initVue();

                window.addEventListener('message', (e) => {
                    if (e.data?.type === 'THEME_CHANGE') {
                        const newTheme = e.data.theme;
                        document.documentElement.setAttribute('data-theme', newTheme);
                        localStorage.setItem('flowork_os_theme', newTheme);
                        if (this.vueInstance) this.vueInstance.theme.global.name.value = newTheme;
                    }
                    if (e.data?.type === 'LANG_CHANGE' && this.vueInstance) {
                        localStorage.setItem('flowork_lang', e.data.lang);
                        this.vueInstance.currentLang.value = e.data.lang;
                    }
                });
            },

            initVue() {
                const { createApp, ref, computed, reactive } = Vue;
                const { createVuetify, useTheme } = Vuetify;

                const app = createApp({
                    setup() {
                        const theme = useTheme();
                        const currentTab = ref('app');
                        const currentLang = ref(localStorage.getItem('flowork_lang') || 'id');
                        const t = computed(() => i18n[currentLang.value] || i18n['en']);

                        // App Logic State
                        const leftFiles = ref([]);
                        const rightFiles = ref([]);
                        const currentMode = ref('audio_master');
                        const isProcessing = ref(false);
                        const progress = reactive({ text: 'IDLE', percent: 0 });
                        const logs = ref([]);
                        let worker = null;

                        const addLog = (msg, color = 'gray') => {
                            logs.value.unshift({ msg, color });
                        };

                        const handleInput = async (files, side) => {
                            const mediaFiles = Array.from(files).filter(f => (f.type.startsWith('video/') || f.type.startsWith('audio/')) && f.size > 0);
                            if (mediaFiles.length === 0) return;

                            addLog(`> SCANNING ${mediaFiles.length} FILES ON ${side.toUpperCase()}...`);
                            const processed = [];
                            for (let i = 0; i < mediaFiles.length; i++) {
                                try {
                                    const duration = await getMediaDuration(mediaFiles[i]);
                                    processed.push({ file: mediaFiles[i], duration });
                                } catch (e) { console.warn("Skip corrupt", mediaFiles[i].name); }
                            }

                            if (side === 'left') leftFiles.value = processed;
                            else rightFiles.value = processed;
                            addLog(`> ${processed.length} VALID FILES LOADED.`, 'green');
                        };

                        const getMediaDuration = (file) => {
                            return new Promise((resolve) => {
                                const url = URL.createObjectURL(file);
                                const el = file.type.startsWith('audio') ? document.createElement('audio') : document.createElement('video');
                                el.preload = 'metadata';
                                el.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(el.duration); };
                                el.onerror = () => { URL.revokeObjectURL(url); resolve(0); };
                                el.src = url;
                            });
                        };

                        const startStitching = async () => {
                            if (!leftFiles.value.length || !rightFiles.value.length) return alert("Pilih kedua folder dulu!");
                            isProcessing.value = true;
                            addLog("> CALCULATING CONTENT FUSION...", 'pop_blue');

                            let masters = currentMode.value === 'audio_master' ? [...rightFiles.value] : [...leftFiles.value];
                            let slaves = currentMode.value === 'audio_master' ? [...leftFiles.value] : [...rightFiles.value];

                            const jobs = masters.map((master, i) => {
                                let targetDur = master.duration;
                                let currentDur = 0;
                                let selectedSlaves = [];
                                while (currentDur < targetDur) {
                                    const pick = slaves[Math.floor(Math.random() * slaves.length)];
                                    selectedSlaves.push(pick.file);
                                    currentDur += pick.duration;
                                }
                                return { masterFile: master.file, slaveFiles: selectedSlaves, index: i + 1, mode: currentMode.value };
                            });

                            for (let i = 0; i < jobs.length; i++) {
                                progress.percent = Math.round((i / jobs.length) * 100);
                                progress.text = `STITCHING ${i + 1}/${jobs.length}`;
                                await runWorker(jobs[i]);
                            }

                            isProcessing.value = false;
                            progress.percent = 100;
                            progress.text = "FINISHED";
                            addLog("> ALL FUSIONS COMPLETE.", 'pop_green');
                        };

                        const runWorker = (job) => {
                            return new Promise((resolve) => {
                                if (worker) worker.terminate();
                                worker = new Worker('./js/worker.js');
                                worker.postMessage({ type: 'PROCESS_STITCH', data: job });
                                worker.onmessage = (e) => {
                                    if (e.data.type === 'DONE') {
                                        downloadBuffer(e.data.buffer, e.data.name);
                                        addLog(`> DONE: ${e.data.name}`, 'pop_green');
                                        resolve();
                                    } else if (e.data.type === 'ERROR') {
                                        addLog(`! ERROR: ${e.data.msg}`, 'pop_pink');
                                        resolve();
                                    }
                                };
                            });
                        };

                        const downloadBuffer = (buffer, name) => {
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(new Blob([buffer], { type: 'video/mp4' }));
                            a.download = name;
                            a.click();
                        };

                        AppCore.vueInstance = { theme, currentLang };
                        return {
                            currentTab, t, leftFiles, rightFiles, currentMode, isProcessing,
                            progress, logs, handleInput, startStitching
                        };
                    }
                });

                app.use(createVuetify({
                    theme: { defaultTheme: document.documentElement.getAttribute('data-theme') || 'dark' }
                })).mount('#vue-root');
            }
        };
        window.onload = () => AppCore.init();
    </script>
</body>
</html>
