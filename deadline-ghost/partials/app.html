<div class="flex flex-col h-full w-full font-sans relative overflow-hidden bg-core">

    <div class="absolute top-[10%] left-[5%] w-24 h-24 bg-pop_pink rounded-full opacity-30 animate-bounce" style="animation-duration: 4s;"></div>
    <div class="absolute top-[20%] right-[10%] w-16 h-16 bg-pop_yellow rounded-full opacity-40 animate-pulse"></div>
    <div class="absolute bottom-[15%] left-[15%] w-32 h-32 bg-pop_blue rounded-full opacity-20 animate-bounce" style="animation-duration: 5s;"></div>
    <div class="absolute bottom-[20%] right-[5%] w-20 h-20 bg-pop_green rounded-full opacity-30 animate-pulse" style="animation-delay: 1s;"></div>

    <div class="flex flex-col md:flex-row justify-between items-center p-4 border-b-4 border-[var(--border-color)] bg-panel z-20 shrink-0 gap-3 gummy-board rounded-none rounded-b-[2rem] shadow-sm relative">
        <div class="flex w-full md:w-auto justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-pop_pink rounded-full flex items-center justify-center border-4 border-[var(--border-color)] shadow-sm transform -rotate-12">
                    <v-icon icon="mdi-ghost" color="white" size="28"></v-icon>
                </div>
                <div>
                    <h1 class="font-display text-2xl font-black text-main m-0 leading-none tracking-wide uppercase">
                        {{ t.app_title }}
                    </h1>
                </div>
            </div>
            <button onclick="window.switchAppTab('lander')" class="md:hidden text-xs text-brand font-black flex items-center gap-1 bg-core px-4 py-2 rounded-full border-4 border-[var(--border-color)] shadow-sm">
                {{ t.btn_info }} <v-icon size="small">mdi-arrow-right</v-icon>
            </button>
        </div>

        <div class="flex w-full md:w-auto gap-2 items-center justify-between md:justify-end">
            <div class="flex bg-pop_yellow border-4 border-[var(--border-color)] px-5 py-2 rounded-full shadow-sm text-xs font-black text-main items-center gap-2 transform rotate-2">
                <v-icon icon="mdi-candycane" size="small" class="text-pop_pink"></v-icon> {{ t.btn_app }}
            </div>
            <button onclick="window.switchAppTab('lander')" class="hidden md:flex text-xs text-main font-black items-center gap-1 bg-core px-5 py-2 rounded-full border-4 border-[var(--border-color)] hover:bg-pop_blue hover:text-white transition shadow-sm">
                <v-icon size="small">mdi-arrow-left</v-icon> {{ t.btn_info }}
            </button>
        </div>
    </div>

    <div class="flex-1 flex flex-col overflow-y-auto md:overflow-hidden min-h-0 p-4 md:p-8 pb-40 md:pb-8 items-center justify-center relative z-10">

        <div class="gummy-board w-full max-w-xl p-6 md:p-10 relative overflow-visible group bg-panel border-4 border-[var(--border-color)] shadow-[0_20px_0_0_rgba(0,0,0,0.05)] mt-8">

            <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-panel border-4 border-[var(--border-color)] rounded-full p-3 shadow-sm animate-bounce z-20">
                <v-icon icon="mdi-ghost-outline" size="48" class="text-pop_pink"></v-icon>
            </div>

            <div class="text-center mb-8 mt-6">
                <h2 class="text-3xl font-black text-main font-display uppercase tracking-wider">{{ t.app_corrupter_title }}</h2>
                <p class="text-xs text-brand font-black mt-2 uppercase bg-core inline-block px-4 py-1 rounded-full border-2 border-[var(--border-color)]">
                    🎯 {{ t.app_corrupter_desc }}
                </p>
            </div>

            <div @click="triggerFileSelect" class="w-full min-h-[220px] rounded-[2rem] border-4 border-dashed border-pop_blue bg-pop_blue/10 flex flex-col items-center justify-center cursor-pointer hover:bg-pop_blue/20 hover:scale-[1.02] hover:border-solid transition-all duration-300 relative overflow-hidden group/zone">
                <input type="file" id="fileInput" class="hidden" @change="handleFileSelect">

                <div v-if="!selectedFile" class="flex flex-col items-center z-10">
                    <div class="w-20 h-20 bg-panel rounded-full border-4 border-pop_blue flex items-center justify-center mb-4 shadow-sm group-hover/zone:-translate-y-2 transition-transform duration-300">
                        <v-icon icon="mdi-cloud-upload" size="40" class="text-pop_blue"></v-icon>
                    </div>
                    <p class="text-base text-pop_blue font-black font-display uppercase mb-1">{{ t.app_drop_title }}</p>
                    <p class="text-xs text-main font-bold">{{ t.app_drop_desc }}</p>
                </div>

                <div v-else class="flex flex-col items-center animate-pulse z-10">
                    <div class="w-20 h-20 bg-pop_pink rounded-full border-4 border-[var(--border-color)] flex items-center justify-center mb-4 shadow-md transform rotate-6">
                        <v-icon icon="mdi-file-document-outline" size="40" class="text-white"></v-icon>
                    </div>
                    <p class="text-sm text-main font-black mb-1 truncate max-w-xs bg-panel px-3 py-1 rounded-full border-2 border-[var(--border-color)]">{{ selectedFile.name }}</p>
                    <p class="text-xs text-muted font-bold mb-4">{{ formattedSize }}</p>
                    <p class="text-[10px] bg-pop_yellow text-main border-2 border-[var(--border-color)] py-1 px-4 rounded-full font-black uppercase tracking-widest shadow-sm">
                        ✨ {{ t.app_ready }} ✨
                    </p>
                </div>
            </div>

            <div class="mt-10 space-y-5">
                <div class="flex justify-between text-[10px] text-muted font-black px-2 uppercase items-center">
                    <span>{{ t.app_level }}</span>
                    <span class="text-white bg-pop_pink px-3 py-1 rounded-full border-2 border-[var(--border-color)] shadow-sm">{{ t.app_level_value }}</span>
                </div>

                <div class="w-full h-8 bg-core rounded-full border-4 border-[var(--border-color)] overflow-hidden p-1 relative shadow-inner">
                    <div class="h-full bg-pop_green rounded-full transition-all duration-300 relative overflow-hidden" :style="{ width: progress + '%' }">
                        <div class="absolute top-0 left-0 w-full h-full bg-white opacity-20 transform -skew-x-12"></div>
                    </div>
                </div>

                <button @click="corruptFile" :disabled="!selectedFile || isCorrupting || isDone"
                        :class="[
                            'btn-game w-full py-5 rounded-[2rem] font-display font-black text-base tracking-widest flex justify-center items-center gap-3 uppercase transition-all shadow-md border-4 border-[var(--border-color)]',
                            (!selectedFile || isCorrupting) && !isDone ? 'bg-core text-muted opacity-60 cursor-not-allowed' : '',
                            selectedFile && !isCorrupting && !isDone ? 'bg-pop_pink text-white hover:brightness-110 hover:scale-[1.02]' : '',
                            isDone ? 'bg-pop_green text-white border-none' : ''
                        ]">

                    <v-icon v-if="!isCorrupting && !isDone" icon="mdi-skull-outline" size="x-large"></v-icon>
                    <v-icon v-if="isCorrupting" icon="mdi-loading" class="animate-spin" size="x-large"></v-icon>
                    <v-icon v-if="isDone" icon="mdi-check-decagram" size="x-large"></v-icon>

                    {{ isCorrupting ? t.app_btn_executing : (isDone ? t.app_btn_done : t.app_btn_execute) }}
                </button>

                <p class="text-center text-xs font-black h-4 uppercase transition-all" :class="isCorrupting ? 'text-pop_pink animate-pulse' : (isDone ? 'text-pop_green' : 'text-muted')">
                    {{ statusLog }}
                </p>
            </div>
        </div>

        <div class="mt-8 text-center z-20">
            <p class="text-[10px] text-main font-black uppercase tracking-widest bg-pop_yellow border-4 border-[var(--border-color)] px-5 py-3 rounded-full inline-block shadow-sm transform rotate-1 hover:rotate-0 transition">
                <v-icon icon="mdi-shield-check" size="small" class="text-pop_pink"></v-icon> {{ t.app_status_wait }}
            </p>
        </div>

    </div>
</div>
