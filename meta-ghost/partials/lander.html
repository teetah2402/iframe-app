<div class="max-w-4xl mx-auto px-6 pt-16 font-sans pb-32">
    <div class="text-center mb-12">
        <div class="animate-pop-in inline-block bg-brand text-white px-6 py-2 rounded-full text-sm font-black tracking-widest mb-6 shadow-lg transform rotate-[-2deg]">
            {{ t.badge }}
        </div>

        <h1 class="animate-pop-in text-5xl md:text-7xl font-display font-black mb-6 text-main tracking-tight leading-tight" style="animation-delay: 0.1s;">
            {{ t.title1 }} <br/>
            <span class="text-pop_pink drop-shadow-sm">{{ t.title2 }}</span>
        </h1>

        <p class="animate-pop-in text-muted text-lg md:text-xl max-w-2xl mx-auto font-bold" style="animation-delay: 0.2s;">
            {{ t.desc }}
        </p>
    </div>

    <div class="animate-pop-in text-center mb-20" style="animation-delay: 0.3s;">
        <button @click="switchTab('app')" class="btn-game bg-pop_green text-white px-12 py-5 text-2xl shadow-xl hover:scale-105 active:scale-95 transition-transform flex items-center justify-center gap-3 mx-auto">
            {{ t.btnLaunch }}
        </button>
    </div>

    <div class="animate-pop-in gummy-board p-8 md:p-12 mb-20 relative overflow-hidden aspect-video flex items-center justify-center group" style="animation-delay: 0.4s;">
        <div class="absolute inset-0 bg-gradient-to-br from-pop_blue/10 to-brand/10 opacity-50"></div>

        <div class="relative z-10 w-40 h-40 bg-white/90 rounded-[2.5rem] flex items-center justify-center shadow-2xl animate-bounce border-4 border-brand">
            <v-icon icon="mdi-ghost" size="80" class="text-brand"></v-icon>
        </div>

        <div class="absolute top-10 right-10 text-6xl animate-pulse">🛰️</div>
        <div class="absolute bottom-10 left-10 text-6xl animate-bounce" style="animation-delay: 0.5s;">📍</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 animate-pop-in" style="animation-delay: 0.5s;">
        <div class="gummy-board p-8 hover:-translate-y-2 transition-transform">
            <div class="bg-pop_yellow w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mb-6 shadow-md">🚀</div>
            <p v-html="t.docF1" class="font-bold text-main leading-relaxed"></p>
        </div>
        <div class="gummy-board p-8 hover:-translate-y-2 transition-transform">
            <div class="bg-pop_pink w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mb-6 shadow-md">🗺️</div>
            <p v-html="t.docF2" class="font-bold text-main leading-relaxed"></p>
        </div>
        <div class="gummy-board p-8 hover:-translate-y-2 transition-transform">
            <div class="bg-pop_blue w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mb-6 shadow-md">🧹</div>
            <p v-html="t.docF3" class="font-bold text-main leading-relaxed"></p>
        </div>
    </div>

    <div class="mt-24 text-center">
        <span class="bg-border/50 text-muted px-8 py-3 rounded-full font-black text-sm border-2 border-dashed border-muted/30">
            {{ t.eof }}
        </span>
    </div>
</div>
