<div class="min-h-full flex flex-col items-center justify-center p-8 text-center bg-transparent">
    <div class="relative w-44 h-44 mb-10 animate-bounce cursor-pointer group">
        <div class="absolute inset-0 bg-pop_pink rounded-[3rem] rotate-12 opacity-30 group-hover:rotate-45 transition-transform duration-500"></div>
        <div class="absolute inset-0 bg-pop_blue rounded-[3rem] -rotate-6 opacity-30 group-hover:-rotate-12 transition-transform duration-500"></div>
        <div class="absolute inset-0 bg-brand rounded-[3rem] shadow-[0_20px_0_rgba(0,0,0,0.15)] border-4 border-white/20 flex items-center justify-center">
            <v-icon icon="mdi-shield-crown" size="90" class="text-white drop-shadow-lg"></v-icon>
        </div>
    </div>

    <h1 class="text-6xl md:text-8xl font-display font-black mb-6 leading-[0.9] text-main tracking-tighter">
        {{ t.heroTitle }} <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand to-pop_pink drop-shadow-sm">{{ t.heroSub }}</span>
    </h1>

    <p class="text-muted text-xl md:text-2xl max-w-xl mx-auto mb-14 font-bold leading-snug">
        {{ t.heroDesc }}
    </p>

    <div class="flex flex-wrap justify-center gap-4 mb-16 max-w-2xl">
        <div class="bg-pop_yellow text-black font-black px-6 py-2 rounded-2xl transform -rotate-2 shadow-lg">NO UPLOAD! 🔒</div>
        <div class="bg-pop_green text-white font-black px-6 py-2 rounded-2xl transform rotate-3 shadow-lg">UNLIMITED! ♾️</div>
        <div class="bg-pop_blue text-white font-black px-6 py-2 rounded-2xl transform -rotate-1 shadow-lg">SUPER FAST! ⚡</div>
    </div>

    <button @click="currentTab = 'app'" class="btn-game px-20 py-7 bg-brand text-white text-4xl shadow-2xl hover:scale-105 active:scale-95 transition-all ring-8 ring-brand/20">
        {{ t.startBtn }}
    </button>
</div>
