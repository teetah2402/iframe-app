<div class="flex flex-col md:flex-row h-full overflow-y-auto md:overflow-hidden pb-40 md:pb-0 p-4 md:p-6 gap-6 relative">

    <div class="absolute top-4 right-6 z-50 flex gap-3">
        <button @click="currentTab = 'lander'" class="btn-game px-6 py-2 bg-panel border-2 border-border text-[11px] flex items-center gap-2">
            <v-icon size="16">mdi-information-outline</v-icon> {{ t.back }}
        </button>
    </div>

    <div class="w-full md:w-96 flex flex-col gap-6 shrink-0 h-auto md:h-full overflow-y-auto no-scrollbar pt-14 md:pt-0">

        <div class="gummy-board p-6 flex flex-col">
            <h3 class="font-display font-black text-brand mb-4 uppercase tracking-tight">{{ t.step1 }}</h3>
            <div class="relative group">
                <input type="file" @change="handleFiles" multiple accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                <div class="border-4 border-dashed border-border rounded-[2rem] p-8 text-center group-hover:border-brand transition-colors bg-black/5">
                    <div class="text-5xl mb-3 animate-pulse">📸</div>
                    <div class="text-lg font-black text-main">{{ targetImages.length }} Files</div>
                    <div class="text-[10px] uppercase font-black opacity-40 mt-1 tracking-widest">{{ t.dropZone }}</div>
                </div>
            </div>
        </div>

        <div class="gummy-board p-6 flex flex-col">
            <h3 class="font-display font-black text-pop_pink mb-4 uppercase tracking-tight">{{ t.step2 }}</h3>
            <div class="flex bg-black/5 p-2 rounded-2xl mb-6">
                <button @click="watermarkType = 'text'" :class="watermarkType === 'text' ? 'bg-panel text-brand shadow-md scale-105' : 'opacity-50'" class="flex-1 py-3 rounded-xl font-black transition-all text-xs">{{ t.text }}</button>
                <button @click="watermarkType = 'image'" :class="watermarkType === 'image' ? 'bg-panel text-brand shadow-md scale-105' : 'opacity-50'" class="flex-1 py-3 rounded-xl font-black transition-all text-xs">{{ t.logo }}</button>
            </div>

            <div v-if="watermarkType === 'text'" class="space-y-4">
                <input v-model="config.text" class="w-full p-4 font-black" placeholder="Teks Watermark...">
                <div class="flex items-center gap-4 bg-black/5 p-3 rounded-2xl border-2 border-border">
                    <span class="text-[10px] font-black opacity-50 uppercase">Warna</span>
                    <input v-model="config.color" type="color" class="flex-1 h-10 rounded-lg cursor-pointer border-none bg-transparent">
                </div>
            </div>
            <div v-else class="bg-black/5 p-4 rounded-2xl border-2 border-dashed border-border">
                <input type="file" @change="handleWMImage" accept="image/*" class="text-[10px] font-black file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-brand file:text-white file:font-black">
            </div>
        </div>

        <div class="gummy-board p-6 flex flex-col">
            <h3 class="font-display font-black text-pop_yellow mb-4 uppercase tracking-tight">{{ t.step3 }}</h3>
            <div class="grid grid-cols-2 gap-3 mb-8">
                <button @click="setPreset('c')" :class="!config.isTiled ? 'border-pop_yellow bg-pop_yellow/10' : 'border-border'" class="bg-black/5 border-2 p-4 rounded-2xl font-black text-xs transition-all uppercase">{{ t.center }}</button>
                <button @click="setPreset('tile')" :class="config.isTiled ? 'border-pop_yellow bg-pop_yellow/10' : 'border-border'" class="bg-black/5 border-2 p-4 rounded-2xl font-black text-xs transition-all uppercase">{{ t.tiled }}</button>
            </div>

            <div class="space-y-8 px-2">
                <div>
                    <div class="flex justify-between text-[11px] font-black mb-3 uppercase tracking-widest opacity-60"><span>{{ t.scale }}</span><span>{{config.scale}}%</span></div>
                    <input v-model="config.scale" type="range" min="5" max="100" class="w-full accent-pop_yellow h-2 bg-border rounded-lg appearance-none">
                </div>
                <div>
                    <div class="flex justify-between text-[11px] font-black mb-3 uppercase tracking-widest opacity-60"><span>{{ t.opacity }}</span><span>{{Math.round(config.opacity*100)}}%</span></div>
                    <input v-model="config.opacity" type="range" min="0" max="1" step="0.01" class="w-full accent-pop_yellow h-2 bg-border rounded-lg appearance-none">
                </div>
            </div>
        </div>

        <div class="mt-auto pt-4">
            <button @click="processBatch" :disabled="isProcessing || targetImages.length === 0" class="btn-game w-full py-6 bg-pop_green text-white text-2xl shadow-xl disabled:opacity-50 border-b-[8px] border-black/20">
                {{ isProcessing ? t.loading : t.processBtn }}
            </button>
            <div v-if="isProcessing" class="mt-6 bg-border h-6 rounded-full overflow-hidden border-2 border-white/20">
                <div class="h-full bg-pop_green transition-all" :style="{width: progress + '%'}"></div>
            </div>
        </div>
    </div>

    <div class="flex-1 gummy-board border-4 relative flex items-center justify-center p-6 min-h-[60vh] md:min-h-0 overflow-hidden bg-black/5 shadow-inner">
        <div v-if="targetImages.length === 0" class="text-center opacity-30 animate-pulse">
            <div class="text-9xl mb-6">🖼️</div>
            <p class="font-display text-3xl font-black tracking-tight uppercase">Preview Area</p>
        </div>

        <div v-else class="relative shadow-2xl rounded-3xl overflow-hidden bg-white border-4 border-white animate-pop-in">
            <canvas
                id="preview-canvas"
                class="max-w-full max-h-[70vh] block cursor-move touch-none"
                @mousedown="startDrag" @mousemove="onDrag" @mouseup="endDrag"
                @touchstart.prevent="startDrag" @touchmove.prevent="onDrag" @touchend="endDrag"
            ></canvas>
            <div class="absolute top-6 left-6 bg-white/90 backdrop-blur px-6 py-3 rounded-full border-2 border-brand text-[11px] font-black flex items-center gap-3 shadow-xl pointer-events-none text-brand uppercase tracking-widest">
                <span class="w-3 h-3 bg-brand rounded-full animate-ping"></span>
                {{ t.dragHint }}
            </div>
        </div>
    </div>
</div>
