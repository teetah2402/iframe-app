<div class="w-full px-6 py-4 flex justify-between items-center bg-panel/50 backdrop-blur-md border-b-4 border-border shrink-0 z-50">
    <div class="flex items-center gap-4">
        <div class="bg-brand p-2 rounded-xl shadow-lg -rotate-6">
            <v-icon icon="mdi-xml" color="white"></v-icon>
        </div>
        <div class="flex flex-col">
            <span class="font-display font-black text-2xl tracking-tighter leading-none text-main uppercase">SYNTAX<span class="text-brand">BREACH</span></span>
            <span class="text-[8px] font-black opacity-40 uppercase tracking-[0.2em] mt-1 text-main">Data Translator Unit</span>
        </div>
    </div>
    <div class="flex gap-3">
        <button @click="currentTab = 'lander'" class="btn-game bg-panel border-4 border-border px-6 py-2 text-[10px] flex items-center gap-2 hover:text-brand transition-all">
            <v-icon size="16">mdi-information-outline</v-icon> BRIEF
        </button>
    </div>
</div>

<div class="flex-1 flex flex-col md:flex-row p-4 md:p-8 gap-8 relative overflow-hidden">

    <div class="w-full md:w-[320px] flex flex-col gap-6 shrink-0 h-auto md:h-full overflow-y-auto no-scrollbar">

        <div class="gummy-board p-6 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-20 h-20 bg-brand opacity-5 rounded-bl-[3rem]"></div>
            <h3 class="font-display font-black text-brand text-xl mb-4 flex items-center gap-2 uppercase tracking-tight">
                <v-icon size="20">mdi-target</v-icon> {{ t.objective }}
            </h3>
            <p class="text-[11px] font-bold text-muted leading-relaxed uppercase tracking-tighter">{{ t.objDesc }}</p>
        </div>

        <div class="gummy-board p-4 flex flex-col gap-3">
            <button @click="mode = 'json'" :class="mode === 'json' ? 'bg-pop_purple text-white' : 'bg-black/5 text-muted'" class="btn-game py-4 rounded-2xl font-black text-xs">{{ t.modeJson }}</button>
            <button @click="mode = 'csv'" :class="mode === 'csv' ? 'bg-pop_green text-white' : 'bg-black/5 text-muted'" class="btn-game py-4 rounded-2xl font-black text-xs">{{ t.modeCsv }}</button>
            <button @click="mode = 'base64'" :class="mode === 'base64' ? 'bg-pop_blue text-white' : 'bg-black/5 text-muted'" class="btn-game py-4 rounded-2xl font-black text-xs">{{ t.modeB64 }}</button>
            <button @click="mode = 'url'" :class="mode === 'url' ? 'bg-pop_pink text-white' : 'bg-black/5 text-muted'" class="btn-game py-4 rounded-2xl font-black text-xs">{{ t.modeUrl }}</button>
        </div>

        <div class="mt-auto flex flex-col gap-4 pb-40 md:pb-6">
            <button @click="copyOut" :disabled="!outputVal" class="btn-game w-full py-6 bg-brand text-white text-xl shadow-[0_8px_0_rgba(0,0,0,0.15)] flex items-center justify-center gap-3">
                <v-icon>mdi-content-copy</v-icon> {{ t.copyBtn }}
            </button>
            <button v-if="mode === 'csv'" @click="downloadCSV" :disabled="!outputVal || outputVal.includes('⚠️')" class="btn-game w-full py-6 bg-pop_green text-white text-xl shadow-[0_8px_0_#04A077] flex items-center justify-center gap-3 animate-pop-in">
                <v-icon>mdi-microsoft-excel</v-icon> {{ t.dlBtn }}
            </button>
        </div>
    </div>

    <div class="flex-1 flex flex-col md:flex-row gap-6 min-h-[70vh] md:min-h-0">

        <div class="flex-1 gummy-board border-4 relative flex flex-col overflow-hidden bg-black/5">
            <div class="px-6 py-4 border-b-2 border-border flex justify-between items-center bg-panel/50">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 bg-pop_pink rounded-full"></span>
                    <span class="text-[11px] font-black text-main uppercase tracking-widest">Input Stream</span>
                </div>
                <button @click="inputVal = ''" class="text-[10px] font-black text-pop_pink uppercase tracking-widest hover:scale-110 transition-transform">{{ t.clearBtn }}</button>
            </div>
            <textarea
                v-model="inputVal"
                class="flex-1 w-full p-6 text-sm font-mono focus:outline-none resize-none no-scrollbar bg-transparent leading-relaxed"
                :placeholder="inputVal ? '' : t.inputHint"
            ></textarea>
        </div>

        <div class="flex-1 gummy-board border-4 border-brand/30 relative flex flex-col overflow-hidden bg-brand/5 shadow-inner">
            <div class="px-6 py-4 border-b-2 border-brand/20 flex justify-between items-center bg-panel/50">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 bg-pop_green rounded-full animate-pulse"></span>
                    <span class="text-[11px] font-black text-brand uppercase tracking-widest">Decoded Output</span>
                </div>
                <v-icon icon="mdi-check-all" size="18" color="pop_green" v-if="outputVal && !outputVal.includes('⚠️')"></v-icon>
            </div>
            <textarea
                readonly
                class="flex-1 w-full p-6 text-sm font-mono focus:outline-none resize-none no-scrollbar bg-transparent font-bold text-brand leading-relaxed"
                :value="outputVal"
                :placeholder="outputVal ? '' : t.outputHint"
            ></textarea>
        </div>

    </div>
</div>
