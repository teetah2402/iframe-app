<div class="min-h-full flex flex-col items-center justify-center p-8 text-center bg-transparent animate-pop-in">

    <div class="relative w-40 h-40 mb-10 animate-bounce cursor-pointer group">
        <div class="absolute inset-0 bg-pop_purple rounded-[3rem] rotate-12 opacity-20 scale-110 group-hover:rotate-45 transition-transform duration-500"></div>
        <div class="absolute inset-0 border-8 border-brand rounded-[2.5rem] bg-panel shadow-[0_15px_0_rgba(0,0,0,0.1)] flex items-center justify-center overflow-hidden">
            <div class="text-5xl font-display font-black text-brand tracking-tighter group-hover:scale-125 transition-transform">
                {<span class="text-pop_pink">;</span>}
            </div>
            <div class="absolute top-4 left-4 w-3 h-3 bg-pop_green rounded-full"></div>
            <div class="absolute top-4 left-9 w-3 h-3 bg-pop_yellow rounded-full"></div>
            <div class="absolute top-4 left-14 w-3 h-3 bg-pop_pink rounded-full"></div>
        </div>
    </div>

    <h1 class="text-6xl md:text-8xl font-display font-black mb-6 leading-[0.9] text-main tracking-tighter">
        {{ t.heroTitle }} <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand to-pop_purple drop-shadow-sm">{{ t.heroSub }}</span>
    </h1>

    <p class="text-muted text-xl md:text-2xl max-w-xl mx-auto mb-14 font-bold leading-snug">
        {{ t.heroDesc }}
    </p>

    <div class="flex flex-wrap justify-center gap-4 mb-16 max-w-2xl">
        <div class="gummy-board px-8 py-3 border-2 flex items-center gap-2 transform -rotate-2">
            <v-icon icon="mdi-shield-lock" color="pop_green"></v-icon>
            <span class="text-xs font-black uppercase tracking-widest">Local Mode</span>
        </div>
        <div class="gummy-board px-8 py-3 border-2 flex items-center gap-2 transform rotate-3">
            <v-icon icon="mdi-code-json" color="pop_purple"></v-icon>
            <span class="text-xs font-black uppercase tracking-widest">Format Pro</span>
        </div>
        <div class="gummy-board px-8 py-3 border-2 flex items-center gap-2 transform -rotate-1">
            <v-icon icon="mdi-file-export" color="pop_pink"></v-icon>
            <span class="text-xs font-black uppercase tracking-widest">CSV Ready</span>
        </div>
    </div>

    <button @click="currentTab = 'app'" class="btn-game px-16 py-6 bg-brand text-white text-3xl shadow-2xl hover:scale-105 active:scale-95 transition-all ring-8 ring-brand/20">
        {{ t.startBtn }}
    </button>
</div>
