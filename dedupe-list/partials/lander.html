<div class="max-w-4xl mx-auto px-4 md:px-6 pt-10 md:pt-16 pb-24 pop-in font-sans">

    <div class="text-center mb-10 md:mb-16">
        <div class="inline-block px-4 py-2 bg-pop_amber/20 text-brand rounded-full text-[10px] font-bold mb-6 tracking-widest shadow-sm border-2 border-brand">
            <v-icon icon="mdi-layers" size="small" class="mr-1"></v-icon> {{ t.app_subtitle }}
        </div>
        <h1 class="text-3xl md:text-6xl font-black mb-4 font-display text-main tracking-tight leading-tight uppercase">
            {{ t.lander_title }} <br>
            <span class="text-brand">{{ t.lander_title_hl }}</span>
        </h1>
        <p class="text-muted max-w-2xl mx-auto text-sm md:text-lg leading-relaxed font-bold">
            {{ t.lander_desc }}
        </p>
    </div>

    <div class="gummy-board w-full max-w-3xl mx-auto overflow-hidden relative aspect-video group mb-10 md:mb-16 transform hover:scale-[1.02] transition-all duration-300 bg-core flex flex-col items-center justify-center p-4">

        <div class="absolute top-[-20%] left-[-10%] w-64 h-64 bg-pop_amber rounded-full opacity-20 animate-pulse"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-56 h-56 bg-pop_yellow rounded-full opacity-20 animate-bounce" style="animation-duration: 3s;"></div>

        <div class="relative z-10 w-full h-full flex items-center justify-center gap-4 md:gap-8">

            <div class="flex flex-col items-center gap-2 group-hover:-translate-x-2 transition duration-500">
                <div class="text-[10px] font-black text-muted uppercase tracking-widest mb-2">RAW</div>
                <div class="relative w-24 md:w-32">
                    <div class="h-8 w-full bg-white border-4 border-muted rounded-xl absolute top-0 left-0 transform -rotate-6 shadow-sm z-10 flex items-center justify-center"><div class="w-1/2 h-2 bg-muted/20 rounded-full"></div></div>
                    <div class="h-8 w-full bg-white border-4 border-muted rounded-xl absolute top-4 left-2 transform rotate-3 shadow-sm z-20 flex items-center justify-center"><div class="w-2/3 h-2 bg-muted/20 rounded-full"></div></div>
                    <div class="h-8 w-full bg-white border-4 border-pop_pink rounded-xl absolute top-8 left-[-5px] transform -rotate-2 shadow-md z-30 flex items-center justify-center animate-pulse"><div class="w-3/4 h-2 bg-pop_pink/20 rounded-full"></div></div> <div class="h-8 w-full bg-white border-4 border-muted rounded-xl absolute top-12 left-1 transform rotate-1 shadow-sm z-40 flex items-center justify-center"><div class="w-1/2 h-2 bg-muted/20 rounded-full"></div></div>
                </div>
            </div>

            <v-icon icon="mdi-arrow-right-thick" class="text-brand text-3xl md:text-5xl animate-pulse"></v-icon>

            <div class="flex flex-col items-center gap-2 group-hover:translate-x-2 transition duration-500">
                <div class="text-[10px] font-black text-brand uppercase tracking-widest mb-2">CLEAN</div>
                <div class="relative w-24 md:w-32">
                    <div class="h-8 w-full bg-brand border-4 border-[var(--border-color)] rounded-xl absolute top-0 left-0 transform shadow-sm z-10 flex items-center justify-center"><div class="w-1/2 h-2 bg-white/40 rounded-full"></div></div>
                    <div class="h-8 w-full bg-brand border-4 border-[var(--border-color)] rounded-xl absolute top-6 left-0 transform shadow-sm z-20 flex items-center justify-center"><div class="w-2/3 h-2 bg-white/40 rounded-full"></div></div>
                    <div class="h-8 w-full bg-brand border-4 border-[var(--border-color)] rounded-xl absolute top-12 left-0 transform shadow-sm z-30 flex items-center justify-center"><div class="w-1/2 h-2 bg-white/40 rounded-full"></div></div>
                </div>
            </div>

        </div>

        <div class="absolute bottom-4 right-4 bg-panel px-4 py-2 rounded-full border-4 border-[var(--border-color)] text-brand font-black text-[10px] md:text-xs shadow-md z-20 flex items-center gap-2">
            <v-icon icon="mdi-check-decagram" size="small" class="text-pop_yellow animate-spin-slow"></v-icon>
            {{ t.lander_badge }}
        </div>
    </div>

    <div class="text-center mb-16 md:mb-20">
        <button onclick="window.switchAppTab('app')" class="btn-game w-full md:w-auto bg-brand text-white hover:brightness-110 font-display py-4 px-10 rounded-[1.5rem] text-sm md:text-lg uppercase tracking-widest shadow-lg">
            {{ t.lander_btn_start }}
        </button>
    </div>

    <div class="max-w-3xl mx-auto text-sm md:text-base border-t-4 border-[var(--border-color)] pt-10">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="gummy-board p-6 bg-panel">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-pop_amber/20 flex items-center justify-center text-brand">
                        <v-icon icon="mdi-flash" size="small"></v-icon>
                    </div>
                    <h3 class="font-black font-display text-main uppercase">{{ t.lander_feat_1 }}</h3>
                </div>
                <p class="text-muted font-bold text-xs">{{ t.lander_feat_1_d }}</p>
            </div>
            <div class="gummy-board p-6 bg-panel">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-pop_green/20 flex items-center justify-center text-pop_green">
                        <v-icon icon="mdi-shield-check" size="small"></v-icon>
                    </div>
                    <h3 class="font-black font-display text-main uppercase">{{ t.lander_feat_2 }}</h3>
                </div>
                <p class="text-muted font-bold text-xs">{{ t.lander_feat_2_d }}</p>
            </div>
        </div>

        <div class="gummy-board p-6 bg-core border-4 border-dashed border-brand/50 text-center">
             <p class="text-xs text-brand font-black italic">"{{ t.lander_msg }}"</p>
        </div>

    </div>
</div>
