<div class="w-full px-6 py-4 flex justify-between items-center bg-panel/50 backdrop-blur-md border-b-4 border-border shrink-0 z-50">
    <div class="flex items-center gap-4">
        <div class="bg-brand p-2 rounded-xl shadow-lg -rotate-6">
            <v-icon icon="mdi-map-marker-distance" color="white"></v-icon>
        </div>
        <div class="flex flex-col">
            <span class="font-display font-black text-2xl tracking-tighter leading-none text-main uppercase">GEO<span class="text-brand">MASK</span></span>
            <span class="text-[8px] font-black opacity-40 uppercase tracking-[0.2em] mt-1 text-main">Location Spoofer v5.0</span>
        </div>
    </div>
    <button @click="currentTab = 'lander'" class="btn-game bg-panel border-4 border-border px-6 py-2 text-[10px] flex items-center gap-2 hover:text-brand transition-all">
        <v-icon size="16">mdi-information-outline</v-icon> BRIEF
    </button>
</div>

<div class="flex-1 flex flex-col md:flex-row p-4 md:p-10 gap-10 relative overflow-hidden">

    <div class="w-full md:w-[380px] flex flex-col gap-8 shrink-0 h-auto md:h-full overflow-y-auto no-scrollbar">

        <div class="gummy-board p-8 flex flex-col relative overflow-hidden bg-black/5 shadow-inner">
            <div class="absolute top-0 right-0 w-24 h-24 bg-brand opacity-5 rounded-bl-[4rem]"></div>
            <h3 class="font-display font-black text-main opacity-60 uppercase text-[11px] tracking-widest mb-8">{{ t.step2 }}</h3>

            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-muted mb-2 block tracking-widest uppercase">Latitude Target</label>
                    <input v-model="lat" type="number" step="any" class="w-full text-lg font-black tracking-tight" placeholder="-6.2088">
                </div>
                <div>
                    <label class="text-[10px] font-black text-muted mb-2 block tracking-widest uppercase">Longitude Target</label>
                    <input v-model="lng" type="number" step="any" class="w-full text-lg font-black tracking-tight" placeholder="106.8456">
                </div>
            </div>

            <div class="flex flex-wrap gap-2 pt-8">
                <button @click="lat=48.8584; lng=2.2945" class="px-4 py-2 bg-pop_blue/10 border-2 border-pop_blue/30 rounded-2xl text-[10px] font-black text-pop_blue hover:bg-pop_blue hover:text-white transition-all uppercase">🇫🇷 Paris</button>
                <button @click="lat=35.6586; lng=139.7454" class="px-4 py-2 bg-pop_blue/10 border-2 border-pop_blue/30 rounded-2xl text-[10px] font-black text-pop_blue hover:bg-pop_blue hover:text-white transition-all uppercase">🇯🇵 Tokyo</button>
                <button @click="lat=-8.4095; lng=115.1889" class="px-4 py-2 bg-pop_blue/10 border-2 border-pop_blue/30 rounded-2xl text-[10px] font-black text-pop_blue hover:bg-pop_blue hover:text-white transition-all uppercase">🇮🇩 Bali</button>
            </div>
        </div>

        <div class="pb-40 md:pb-6">
            <button @click="injectLoc" :disabled="!filePreview || isProcessing" class="btn-game w-full py-8 bg-pop_green text-black text-2xl shadow-[0_12px_0_#04A077] hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-30">
                <span v-if="!isProcessing">{{ t.injectBtn }}</span>
                <span v-else class="flex items-center justify-center gap-3 animate-pulse">
                    <v-icon class="animate-spin">mdi-loading</v-icon> SPOOFING...
                </span>
            </button>
        </div>
    </div>

    <div class="flex-1 gummy-board border-8 relative flex flex-col bg-black/5 overflow-hidden shadow-inner">

        <div v-if="!filePreview"
            @click="$refs.fileInput.click()"
            class="m-8 flex-1 border-4 border-dashed border-border rounded-[3rem] transition-all duration-300 cursor-pointer text-center group flex flex-col items-center justify-center bg-panel/30"
        >
            <input type="file" ref="fileInput" @change="handleFile" accept="image/jpeg, image/jpg" class="hidden">
            <div class="text-8xl mb-6 group-hover:scale-110 transition-transform">📍</div>
            <h4 class="font-display font-black text-3xl text-main uppercase tracking-tighter">{{ t.step1 }}</h4>
            <p class="text-xs font-black opacity-40 uppercase mt-2 tracking-widest">JPG / JPEG ONLY • EXIF TARGET</p>
        </div>

        <div v-else class="flex-1 flex flex-col p-10 relative">
            <div class="flex justify-between items-center mb-8">
                <h3 class="font-display font-black text-main opacity-60 uppercase text-[11px] tracking-widest">{{ t.step3 }}</h3>
                <button @click="filePreview=null" class="btn-game px-6 py-2 bg-pop_pink text-white text-[10px] shadow-[0_4px_0_rgba(0,0,0,0.2)]">RESET TARGET</button>
            </div>

            <div class="flex-1 flex flex-col items-center justify-center gap-10">
                <div class="relative group">
                    <img :src="filePreview" class="max-h-[55vh] rounded-[3rem] shadow-[0_40px_80px_rgba(0,0,0,0.3)] border-[12px] border-white dark:border-border animate-pop-in">

                    <div v-if="hasExif" class="absolute -top-6 -right-6 bg-pop_pink text-white px-8 py-3 rounded-full shadow-2xl font-black text-xs tracking-widest border-4 border-white animate-bounce uppercase">
                        Real GPS Found! ⚠️
                    </div>
                </div>

                <div class="text-center bg-panel px-10 py-5 rounded-[2rem] border-4 border-border shadow-sm">
                    <p class="font-display text-3xl font-black text-brand tracking-tighter truncate max-w-sm">{{ fileName }}</p>
                    <p class="text-xs font-black opacity-50 mt-1 uppercase tracking-widest text-main">Ready for digital alibi</p>
                </div>
            </div>

            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(var(--brand-color) 2px, transparent 2px); background-size: 30px 30px;"></div>
        </div>
    </div>
</div>
