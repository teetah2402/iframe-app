<div class="min-h-full flex flex-col items-center justify-center p-8 text-center bg-transparent animate-pop-in">

    <div class="relative w-44 h-44 mb-10 animate-bounce cursor-pointer group">
        <div class="absolute inset-0 bg-brand rounded-full rotate-12 opacity-20 scale-125 animate-pulse"></div>
        <div class="absolute inset-0 border-8 border-brand border-dashed rounded-full animate-spin" style="animation-duration: 15s"></div>
        <div class="absolute inset-0 border-8 border-brand rounded-[3rem] bg-panel shadow-[0_15px_0_rgba(0,0,0,0.1)] flex items-center justify-center">
            <div class="relative w-20 h-28 bg-brand rounded-t-full rounded-b-lg border-4 border-white/20 flex flex-col items-center pt-4 shadow-xl group-hover:scale-110 transition-transform">
                <div class="w-8 h-8 bg-white/90 rounded-full border-4 border-brand"></div>
                <div class="mt-auto mb-2 w-10 h-1 bg-white/20 rounded-full"></div>
            </div>
            <div class="absolute -bottom-4 w-12 h-4 bg-black/20 rounded-full blur-sm"></div>
        </div>
    </div>

    <h1 class="text-6xl md:text-8xl font-display font-black mb-6 leading-[0.9] text-main tracking-tighter">
        {{ t.heroTitle }} <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand to-pop_blue drop-shadow-sm">{{ t.heroSub }}</span>
    </h1>

    <p class="text-muted text-xl md:text-2xl max-w-xl mx-auto mb-14 font-bold leading-snug">
        {{ t.heroDesc }}
    </p>

    <div class="flex flex-wrap justify-center gap-4 mb-16 max-w-2xl">
        <div class="gummy-board px-8 py-3 border-2 flex items-center gap-2 transform -rotate-2">
            <v-icon icon="mdi-shield-lock" color="brand"></v-icon>
            <span class="text-xs font-black uppercase tracking-widest">Anti-Stalker</span>
        </div>
        <div class="gummy-board px-8 py-3 border-2 flex items-center gap-2 transform rotate-3">
            <v-icon icon="mdi-map-marker-off" color="pop_blue"></v-icon>
            <span class="text-xs font-black uppercase tracking-widest">Fake Flexing</span>
        </div>
        <div class="gummy-board px-8 py-3 border-2 flex items-center gap-2 transform -rotate-1">
            <v-icon icon="mdi-incognito" color="pop_green"></v-icon>
            <span class="text-xs font-black uppercase tracking-widest">Private Fix</span>
        </div>
    </div>

    <button @click="currentTab = 'app'" class="btn-game px-16 py-6 bg-brand text-white text-3xl shadow-2xl hover:scale-105 active:scale-95 transition-all ring-8 ring-brand/20">
        {{ t.startBtn }}
    </button>
</div>
