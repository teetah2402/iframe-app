<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geo Mask | Privasi Aman, Lokasi Samaran!</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Persistence Logic: Anti-Flicker reload
      const getSavedTheme = () => localStorage.getItem('flowork_os_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', getSavedTheme());

      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: 'var(--brand-color)', core: 'var(--bg-core)', panel: 'var(--bg-panel)',
              main: 'var(--text-main)', muted: 'var(--text-muted)', border: 'var(--border-color)',
              pop_pink: '#FF4D6D', pop_blue: '#00B4D8', pop_green: '#06D6A0', pop_yellow: '#FFD166',
            },
            fontFamily: { sans: ['"Quicksand"', 'sans-serif'], display: ['"Fredoka"', 'sans-serif'] },
          }
        }
      }
    </script>

    <style>
        :root {
            --bg-core: #F0F4FF; --bg-panel: #FFFFFF; --text-main: #1E1B4B;
            --text-muted: #4338CA; --border-color: #CBD5E1; --brand-color: #F72585;
            --soft-shadow: 0 20px 25px -5px rgba(30, 27, 75, 0.1);
        }
        [data-theme='dark'] {
            --bg-core: #0F172A; --bg-panel: #1E293B; --text-main: #FFFFFF !important;
            --text-muted: #94A3B8 !important; --border-color: #334155; --brand-color: #FF006E;
            --soft-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* HIDE SCROLLBAR GLOBAL */
        * { -ms-overflow-style: none; scrollbar-width: none; }
        *::-webkit-scrollbar { display: none; }

        html, body {
            background-color: var(--bg-core); color: var(--text-main);
            width: 100%; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            transition: background-color 0.4s ease; margin: 0; padding: 0;
            user-select: none;
        }

        .gummy-board {
            background: var(--bg-panel); border-radius: 2.5rem;
            border: 4px solid var(--border-color); box-shadow: var(--soft-shadow);
        }

        /* Input Look "Diukir" */
        textarea, input {
            color: var(--text-main) !important; background: rgba(0,0,0,0.05) !important;
            border: 3px solid var(--border-color) !important; border-radius: 1.2rem !important;
            outline: none !important; font-weight: 700 !important;
        }

        .btn-game {
            border-bottom: 6px solid rgba(0,0,0,0.25); border-radius: 1.5rem;
            font-weight: 800; transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
        }
        .btn-game:active:not(:disabled) { border-bottom-width: 0px; transform: translateY(6px); }

        .tab-fade-enter-active { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tab-fade-enter-from { opacity: 0; transform: scale(0.95) translateY(30px); }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body>
    <main class="flex-1 relative w-full h-full" id="vue-root"></main>

    <script>
        const i18n = {
            id: {
                heroTitle: "Jaga Privasi,", heroSub: "Samarkan Lokasi!",
                heroDesc: "Setiap foto nyimpen koordinat rumah lo. Geo Mask bakal nyuntikkin lokasi palsu biar stalker pusing!",
                startBtn: "Mulai Spoofing! 📍",
                appTitle: "Geo Mask",
                step1: "1. UPLOAD TARGET 📸", step2: "2. SET KOORDINAT 🌍", step3: "3. HASIL INJEKSI ✨",
                injectBtn: "INJECT FAKE LOCATION!",
                copied: "Lokasi Tersimpan! 🍬", back: "Kembali"
            },
            en: {
                heroTitle: "Protect Privacy,", heroSub: "Mask Your Location!",
                heroDesc: "Every photo hides your home coords. Geo Mask injects fake locations to keep stalkers away!",
                startBtn: "Start Spoofing! 📍",
                appTitle: "Geo Mask",
                step1: "1. UPLOAD TARGET 📸", step2: "2. SET COORDINATES 🌍", step3: "3. INJECTION RESULT ✨",
                injectBtn: "INJECT FAKE LOCATION!",
                copied: "Location Saved! 🍬", back: "Back"
            }
        };

        const AppCore = {
            vueInstance: null,
            async init() {
                const cb = Date.now();
                const [rLander, rApp] = await Promise.all([
                    fetch('partials/lander.html?v=' + cb),
                    fetch('partials/app.html?v=' + cb)
                ]);

                document.getElementById('vue-root').innerHTML = `
                    <v-app style="background: transparent;">
                        <v-main class="h-full relative overflow-hidden flex flex-col">
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'lander'" class="w-full h-full overflow-y-auto absolute top-0 left-0">
                                    ${await rLander.text()}
                                </div>
                            </transition>
                            <transition name="tab-fade">
                                <div v-show="currentTab === 'app'" class="w-full h-full overflow-y-auto md:overflow-hidden flex flex-col absolute top-0 left-0">
                                    ${await rApp.text()}
                                </div>
                            </transition>
                        </v-main>
                    </v-app>`;

                this.initVue();

                window.addEventListener('message', (e) => {
                    if (e.data?.type === 'THEME_CHANGE') {
                        const newTheme = e.data.theme;
                        document.documentElement.setAttribute('data-theme', newTheme);
                        localStorage.setItem('flowork_os_theme', newTheme);
                        if (this.vueInstance) this.vueInstance.theme.global.name.value = newTheme;
                    }
                    if (e.data?.type === 'LANG_CHANGE' && this.vueInstance) {
                        const newLang = e.data.lang;
                        localStorage.setItem('flowork_lang', newLang);
                        this.vueInstance.currentLang.value = newLang;
                    }
                });
            },

            initVue() {
                const { createApp, ref, computed } = Vue;
                const { createVuetify, useTheme } = Vuetify;

                const app = createApp({
                    setup() {
                        const theme = useTheme();
                        const currentTab = ref('app');
                        const currentLang = ref(localStorage.getItem('flowork_lang') || 'id');
                        const t = computed(() => i18n[currentLang.value] || i18n['en']);

                        const filePreview = ref(null);
                        const fileName = ref('');
                        const lat = ref(-8.4095);
                        const lng = ref(115.1889);
                        const isProcessing = ref(false);
                        const hasExif = ref(false);

                        const decimalToDMS = (decimal) => {
                            const abs = Math.abs(decimal);
                            const degrees = Math.floor(abs);
                            const minutesFloat = (abs - degrees) * 60;
                            const minutes = Math.floor(minutesFloat);
                            const seconds = Math.round((minutesFloat - minutes) * 60 * 100);
                            return [[degrees, 1], [minutes, 1], [seconds, 100]];
                        };

                        const handleFile = (e) => {
                            const file = e.target.files[0];
                            if (!file || !file.type.match('image/jp.*')) return alert("Format Wajib JPG/JPEG, Bro!");
                            fileName.value = file.name;
                            const reader = new FileReader();
                            reader.onload = (ev) => {
                                filePreview.value = ev.target.result;
                                try {
                                    const exif = piexif.load(ev.target.result);
                                    hasExif.value = (exif['GPS'] && Object.keys(exif['GPS']).length > 0);
                                } catch { hasExif.value = false; }
                            };
                            reader.readAsDataURL(file);
                        };

                        const injectLoc = () => {
                            isProcessing.value = true;
                            setTimeout(() => {
                                try {
                                    const gps = {};
                                    gps[piexif.GPSIFD.GPSLatitudeRef] = lat.value < 0 ? 'S' : 'N';
                                    gps[piexif.GPSIFD.GPSLatitude] = decimalToDMS(lat.value);
                                    gps[piexif.GPSIFD.GPSLongitudeRef] = lng.value < 0 ? 'W' : 'E';
                                    gps[piexif.GPSIFD.GPSLongitude] = decimalToDMS(lng.value);

                                    const exifObj = {"0th":{}, "Exif":{}, "GPS":gps, "1st":{}, "thumbnail":null};
                                    const exifBytes = piexif.dump(exifObj);
                                    const newImage = piexif.insert(exifBytes, filePreview.value);

                                    const link = document.createElement("a");
                                    link.href = newImage;
                                    link.download = "MASKED_" + fileName.value;
                                    link.click();
                                    isProcessing.value = false;
                                } catch (err) { alert("Injeksi Gagal!"); isProcessing.value = false; }
                            }, 800);
                        };

                        AppCore.vueInstance = { theme, currentLang };
                        return { currentTab, t, filePreview, fileName, lat, lng, isProcessing, hasExif, handleFile, injectLoc };
                    }
                });

                app.use(createVuetify({
                    theme: { defaultTheme: document.documentElement.getAttribute('data-theme') || 'dark' }
                })).mount('#vue-root');
            }
        };
        window.onload = () => AppCore.init();
    </script>
</body>
</html>
