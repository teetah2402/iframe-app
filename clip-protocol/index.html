<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clip Protocol | Flowork Gummy</title>

    <link rel="icon" href="./icon.svg" type="image/svg+xml">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.0.0/dist/vuetify.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@5.x/css/materialdesignicons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: 'var(--brand-color)', core: 'var(--bg-core)', panel: 'var(--bg-panel)',
              main: 'var(--text-main)', muted: 'var(--text-muted)', border: 'var(--border-color)',
              pop_pink: '#FF4D6D', pop_blue: '#00B4D8', pop_green: '#06D6A0', pop_yellow: '#FFD166',
            },
            fontFamily: { sans: ['"Quicksand"', 'sans-serif'], display: ['"Fredoka"', 'sans-serif'] },
          }
        }
      }
    </script>

    <style>
        /* GUMMY BOARD THEME ENGINE */
        :root {
            --bg-core: #F0F4FF; --bg-panel: #FFFFFF; --text-main: #1E1B4B;
            --text-muted: #4338CA; --border-color: #CBD5E1; --brand-color: #FF4D6D; /* Pink Gummy Style */
            --soft-shadow: 0 20px 25px -5px rgba(30, 27, 75, 0.1);
        }
        [data-theme='dark'] {
            --bg-core: #0F172A; --bg-panel: #1E293B; --text-main: #FFFFFF !important;
            --text-muted: #94A3B8 !important; --border-color: #334155; --brand-color: #00B4D8; /* Blue Neon for App */
            --soft-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        html, body {
           background-color: var(--bg-core); color: var(--text-main);
           width: 100%; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
           transition: background-color 0.4s ease;
        }

        /* GUMMY RUMUS VISUAL */
        .gummy-board {
            background: var(--bg-panel); border-radius: 2.5rem;
            border: 4px solid var(--border-color); box-shadow: var(--soft-shadow);
        }
        textarea, input, select {
            color: var(--text-main) !important; background: rgba(0,0,0,0.03) !important;
            border: 2px solid var(--border-color) !important; border-radius: 1.5rem !important;
            outline: none !important; font-weight: 700 !important;
        }
        .btn-game {
            border-bottom: 6px solid rgba(0,0,0,0.2); border-radius: 1.5rem;
            font-weight: 800; transition: all 0.1s ease;
            cursor: pointer; /* FIX: Pastikan button terlihat bisa diklik */
        }
        .btn-game:active:not(:disabled) {
            border-bottom-width: 0px; transform: translateY(6px);
        }

        /* ANIMATIONS */
        .tab-fade-enter-active { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tab-fade-enter-from { opacity: 0; transform: scale(0.9) translateY(20px); }
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <main class="flex-1 relative w-full h-full" id="vue-root"></main>

    <script type="module">
        import { init } from './js/core.js';

        // KAMUS I18N
        const i18n = {
            id: {
                app_title: "CLIP PROTOCOL",
                btn_info: "INFO & TUTORIAL",
                btn_app: "STUDIO CUTTER",

                // Studio Text
                studio_monitor: "STUDIO MONITOR",
                btn_orig: "ORIGINAL",
                btn_tiktok: "TIKTOK / REELS",
                opt_as_source: "SAMA KAYA ASLI",
                tap_upload: "KLIK BUAT UPLOAD VIDEO",
                no_media: "Belum Ada Video",
                btn_set_start: "SET START [A]",

                // Tabs
                tab_manual: "MANUAL",
                tab_magic: "MAGIC",
                tab_style: "GAYA TEKS",

                // Labels
                lbl_format: "FORMAT: START-END|Caption",
                lbl_duration: "DURASI (DETIK)",
                lbl_count: "JUMLAH BAGIAN",
                lbl_font: "JENIS FONT",
                lbl_text_col: "WARNA TEKS",
                lbl_bg_col: "WARNA LATAR",
                lbl_bg_op: "TRANSPARANSI",
                lbl_size: "UKURAN FONT",
                btn_gen: "AUTO",

                // System
                btn_process: "POTONG & PROSES BATCH",
                log_ready: "> SYSTEM v8.5 GUMMY READY",

                // Lander
                lander_badge: "✨ REVOLUSI EDITING VIDEO",
                lander_title: "POTONG VIDEO",
                lander_title_hl: "BRUTAL",
                lander_title_2: "TANPA RIBET.",
                lander_desc: "Jujurly, ngedit video panjang buat jadi shorts itu capek banget kan? Clip Protocol hadir buat nyelamatin hidup lo. Potong, kasih caption otomatis (rata tengah valid!), dan sikat engagement.",
                lander_btn_start: "GAS COBAIN SEKARANG",
                lander_art_badge: "WYSIWYG ENGINE",
                lander_f1_title: "Privasi Aman Jaya",
                lander_f1_desc: "Video lo diproses lokal di browser. Gak ada upload ke server antah berantah. Aman dari tangan jahil.",
                lander_f2_title: "Center Text Hack",
                lander_f2_desc: "Fitur langka! Teks lo bener-bener di tengah (True Center), gak miring kiri kanan kayak janji manis mantan.",
                lander_f3_title: "Ringan & Sat-set",
                lander_f3_desc: "Gak perlu install software berat yang bikin laptop ngebul. Cukup buka browser, drop video, potong, kelar."
            },
            en: {
                app_title: "CLIP PROTOCOL",
                btn_info: "INFO & TUTORIAL",
                btn_app: "STUDIO CUTTER",

                studio_monitor: "STUDIO MONITOR",
                btn_orig: "ORIGINAL",
                btn_tiktok: "TIKTOK / REELS",
                opt_as_source: "AS SOURCE",
                tap_upload: "TAP TO UPLOAD VIDEO",
                no_media: "No Media Loaded",
                btn_set_start: "SET START [A]",

                tab_manual: "MANUAL",
                tab_magic: "MAGIC",
                tab_style: "STYLE",

                lbl_format: "FORMAT: START-END|Caption",
                lbl_duration: "DURATION (SEC)",
                lbl_count: "SPLIT COUNT",
                lbl_font: "FONT FAMILY",
                lbl_text_col: "TEXT COLOR",
                lbl_bg_col: "BG COLOR",
                lbl_bg_op: "BG OPACITY",
                lbl_size: "FONT SIZE",
                btn_gen: "GEN",

                btn_process: "PROCESS BATCH",
                log_ready: "> SYSTEM v8.5 GUMMY READY",

                lander_badge: "✨ VIDEO EDITING REVOLUTION",
                lander_title: "CUT VIDEOS",
                lander_title_hl: "BRUTALLY",
                lander_title_2: "WITHOUT THE HASSLE.",
                lander_desc: "Honestly, editing long videos into shorts is exhausting, right? Clip Protocol is here to save your life. Cut, add auto-captions (true center!), and boost engagement.",
                lander_btn_start: "TRY IT NOW",
                lander_art_badge: "WYSIWYG ENGINE",
                lander_f1_title: "Total Privacy",
                lander_f1_desc: "Processed locally in your browser. No shady server uploads. Safe from prying eyes.",
                lander_f2_title: "Center Text Hack",
                lander_f2_desc: "Rare feature! Your text is perfectly centered (True Center), not leaning left or right.",
                lander_f3_title: "Light & Fast",
                lander_f3_desc: "No need for heavy software that melts your laptop. Open browser, drop video, cut, done."
            }
        };

        const AppCore = {
            vueInstance: null,

            async initApp() {
                const savedTheme = localStorage.getItem('flowork_theme') || 'dark';
                document.documentElement.setAttribute('data-theme', savedTheme);

                const cb = Date.now();
                const [rLander, rApp] = await Promise.all([fetch('partials/lander.html?v='+cb), fetch('partials/app.html?v='+cb)]);

                document.getElementById('vue-root').innerHTML = `
                   <v-app style="background: transparent;">
                       <v-main class="h-full flex flex-col relative overflow-hidden">
                           <transition name="tab-fade"><div v-show="currentTab === 'lander'" class="w-full h-full overflow-y-auto absolute top-0 left-0">${await rLander.text()}</div></transition>
                           <transition name="tab-fade"><div v-show="currentTab === 'app'" class="w-full h-full overflow-y-auto md:overflow-hidden pb-40 md:pb-0 flex flex-col absolute top-0 left-0">${await rApp.text()}</div></transition>
                       </v-main>
                   </v-app>`;

                this.initVue(savedTheme);

                window.addEventListener('message', (e) => {
                    if (e.data?.type === 'THEME_CHANGE') {
                        document.documentElement.setAttribute('data-theme', e.data.theme);
                        localStorage.setItem('flowork_theme', e.data.theme);
                        if(this.vueInstance) this.vueInstance.theme.global.name.value = e.data.theme;
                    }
                    if (e.data?.type === 'LANG_CHANGE' && this.vueInstance) {
                        localStorage.setItem('flowork_lang', e.data.lang);
                        this.vueInstance.currentLang.value = e.data.lang;
                    }
                });

                console.log("SYSTEM: CLIP PROTOCOL READY (GUMMY V5.0)");
            },

            initVue(savedTheme) {
                const { createApp, ref, computed, onMounted, nextTick } = Vue;
                const { createVuetify, useTheme } = Vuetify;

                const app = createApp({
                    setup() {
                        const theme = useTheme();
                        // Wajib default app
                        const currentTab = ref('app');
                        const editorTab = ref('manual'); // internal tab app.html

                        const currentLang = ref(localStorage.getItem('flowork_lang') || 'en');
                        const t = computed(() => i18n[currentLang.value] || i18n['en']);

                        onMounted(() => {
                            // Panggil fungsi init() asli dari core.js setelah DOM Vue ter-render
                            nextTick(() => {
                                if (typeof init === 'function') {
                                    setTimeout(() => init(), 300);
                                }
                            });
                        });

                        AppCore.vueInstance = { theme, currentLang, currentTab }; // FIX: currentTab dimasukin ke AppCore
                        return {
                            currentTab, editorTab, t
                        };
                    }
                });

                app.use(createVuetify({ theme: { defaultTheme: savedTheme } })).mount('#vue-root');
            }
        };

        // FIX: FUNGSI TABBING GLOBAL YANG BENAR-BENAR JALAN
        window.switchAppTab = (tabName) => {
            console.log("Mencoba pindah tab ke:", tabName);
            if(AppCore.vueInstance && AppCore.vueInstance.currentTab) {
                 AppCore.vueInstance.currentTab.value = tabName; // Update reaktif via ref langsung
            } else {
                 console.error("Gagal ganti tab, Vue belum siap atau referensi hilang.");
            }
        };

        window.appCore = AppCore;
        window.addEventListener('DOMContentLoaded', () => AppCore.initApp());

    </script>
</body>
</html>
